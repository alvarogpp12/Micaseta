<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micaseta</title>
<style>
  body { background:#0d1117; color:#8b93a5; font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif; display:grid; place-items:center; min-height:100vh; margin:0; }
  p { font-size:15px; padding:0 20px; text-align:center; line-height:1.6; }
</style>
</head>
<body>
<p id="msg">Abriendo tu acceso…</p>
<script>
// Página antigua del staff: ahora camarero y puerta tienen su propia interfaz.
fetch('/api/me')
  .then((r) => (r.ok ? r.json() : Promise.reject()))
  .then((me) => location.replace(me.role === 'puerta' ? '/puerta/' : '/camarero/'))
  .catch(() => {
    document.getElementById('msg').textContent =
      'Sesión no válida. Pide al responsable de la caseta que te reenvíe tu enlace de acceso.';
  });
</script>
</body>
</html>
