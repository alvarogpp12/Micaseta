<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Escáner — Micaseta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1117; --card:#161b26; --border:#252c3b; --text:#f2f4f8; --muted:#8b93a5;
    --primary:#5b6cff; --primary-dark:#4353f0; --ok:#12b76a; --danger:#f04438;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; touch-action:manipulation; overflow-x:hidden; min-height:100vh; }
  header { padding:14px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
  .wordmark { font-weight:800; font-size:16px; letter-spacing:-.03em; }
  .wordmark i { color:var(--primary); font-style:normal; }
  header span.who { color:var(--muted); font-size:13px; font-weight:500; }
  main { padding:16px; max-width:480px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px; }
  video { width:100%; border-radius:10px; background:#000; }
  button { border:0; border-radius:10px; padding:13px 16px; font:600 15px Inter,sans-serif; cursor:pointer; width:100%; margin-top:10px; transition:background .15s; }
  .primary { background:var(--primary); color:#fff; }
  .primary:hover { background:var(--primary-dark); }
  .good { background:var(--ok); color:#fff; }
  .ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  .status { display:flex; align-items:center; gap:14px; }
  .status img { width:96px; height:96px; border-radius:12px; object-fit:cover; background:#0d1117; border:1px solid var(--border); }
  .badge { display:inline-block; padding:4px 12px; border-radius:99px; font:700 12.5px Inter,sans-serif; }
  .b-ok { background:rgba(18,183,106,.15); color:#3ddc93; border:1px solid rgba(18,183,106,.4); }
  .b-bad { background:rgba(240,68,56,.12); color:#ff7a70; border:1px solid rgba(240,68,56,.4); }
  .muted { color:var(--muted); font-size:13px; margin-top:4px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:0; }
  .stepper { display:flex; align-items:center; gap:10px; }
  .stepper button { width:36px; padding:6px 0; margin:0; background:#232a3a; color:var(--text); font-size:17px; border-radius:8px; }
  .stepper b { min-width:16px; text-align:center; }
  .total { font-size:19px; font-weight:800; text-align:right; margin-top:12px; letter-spacing:-.01em; }
  input[type=text] { width:100%; padding:12px; border-radius:9px; border:1px solid var(--border); background:#0d1117; color:var(--text); font:400 16px Inter,sans-serif; outline:none; }
  input[type=text]:focus { border-color:var(--primary); }
  .hidden { display:none; }
  .err { color:#ff7a70; font:600 13.5px Inter,sans-serif; margin-top:10px; }
  .okmsg { color:#3ddc93; font:700 14px Inter,sans-serif; margin-top:12px; }
  label.small { display:block; color:var(--muted); font:600 12px Inter,sans-serif; margin:12px 0 6px; }
  #demoBtns button { text-align:left; font-size:14px; }
  /* TPV del camarero: categorías → tocar producto para añadir → comanda */
  .cats { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .cats::-webkit-scrollbar { display:none; }
  .cats button { width:auto; margin:0; flex-shrink:0; padding:9px 14px; border-radius:99px; font:600 13.5px Inter,sans-serif; background:#232a3a; color:var(--muted); }
  .cats button.on { background:var(--primary); color:#fff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; max-height:38vh; overflow-y:auto; padding:2px; }
  .tile { margin:0; padding:12px 12px 10px; border-radius:11px; background:#1d2432; border:1px solid var(--border); color:var(--text); text-align:left; font:600 13.5px/1.3 Inter,sans-serif; display:flex; flex-direction:column; gap:5px; min-height:68px; position:relative; }
  .tile:active { background:#28324a; border-color:var(--primary); }
  .tile .price { color:var(--muted); font:500 12.5px Inter,sans-serif; margin-top:auto; }
  .tile .n { position:absolute; top:7px; right:7px; background:var(--primary); color:#fff; min-width:22px; height:22px; border-radius:99px; display:grid; place-items:center; font:700 12px Inter,sans-serif; padding:0 6px; }
  .ticket-box { margin-top:14px; border-top:1px solid var(--border); padding-top:12px; }
  .ticket-title { font:700 11.5px Inter,sans-serif; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:4px; }
  .trow { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
  .trow:last-child { border-bottom:0; }
  .trow .tname { flex:1; min-width:0; font:500 14px Inter,sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trow .tsum { color:var(--muted); font-size:13px; white-space:nowrap; }
</style>
</head>
<body>
<header><span class="wordmark">micaseta<i>.</i></span><span class="who" id="who">…</span></header>
<main>
  <div id="login" class="card hidden">
    <p style="font-size:14.5px;line-height:1.6">Sesión no válida. Pide al responsable de la caseta que te reenvíe tu enlace de acceso.</p>
  </div>

  <div id="scanner" class="card hidden">
    <video id="video" playsinline></video>
    <button class="primary" id="startCam">Escanear código QR</button>
    <label class="small">O introduce el código manualmente</label>
    <input type="text" id="manual" placeholder="Código del QR">
    <button class="ghost" id="manualBtn">Comprobar</button>
    <div id="demoZone" class="hidden">
      <label class="small">Modo demo — simula el escaneo de una persona</label>
      <div id="demoBtns"></div>
    </div>
  </div>

  <div id="result" class="card hidden">
    <div class="status">
      <img id="photo" alt="Foto">
      <div>
        <div id="pname" style="font-size:17px;font-weight:700;letter-spacing:-.01em"></div>
        <div id="phost" class="muted"></div>
        <div style="margin-top:7px"><span id="pbadge" class="badge"></span></div>
        <div id="preason" class="muted"></div>
      </div>
    </div>
    <div id="doorActions" class="hidden">
      <button class="good" id="checkinBtn">Registrar entrada</button>
    </div>
    <div id="waiterActions" class="hidden">
      <div id="limits" class="muted" style="margin:12px 0 8px"></div>
      <div class="cats" id="cats"></div>
      <div class="grid" id="products"></div>
      <div class="ticket-box">
        <div class="ticket-title">Comanda</div>
        <div id="ticket"><p class="muted" id="ticketEmpty">Toca un producto para añadirlo.</p></div>
        <div class="total" id="total">0,00 €</div>
        <button class="good" id="orderBtn">Cargar a la cuenta del socio</button>
      </div>
    </div>
    <div id="resMsg"></div>
    <button class="ghost" id="againBtn">Escanear otro</button>
  </div>
</main>
<script src="/vendor/jsQR.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const eur = (c) => (c / 100).toFixed(2).replace('.', ',') + ' €';
let me = null, current = null, products = [], qty = {};

async function api(path, opts) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || 'Error');
  return body;
}

async function init() {
  try {
    me = await api('/api/me');
    $('who').textContent = `${me.name} · ${me.role === 'puerta' ? 'Puerta' : 'Camarero'}`;
    $('scanner').classList.remove('hidden');
    if (me.role !== 'puerta') {
      products = await api('/api/products');
      const ORDER = ['cerveza','vino','refresco','copa','botella','comida'];
      products.sort((a, b) => (ORDER.indexOf(a.category) - ORDER.indexOf(b.category)) || a.name.localeCompare(b.name));
    }
    try {
      const demos = await api('/api/demo-qrs');
      if (Array.isArray(demos) && demos.length) {
        $('demoZone').classList.remove('hidden');
        for (const d of demos) {
          const b = document.createElement('button');
          b.className = 'ghost'; b.textContent = d.label;
          b.onclick = () => onScan(d.token);
          $('demoBtns').appendChild(b);
        }
      }
    } catch {}
  } catch { $('login').classList.remove('hidden'); }
}

let stream = null, scanning = false;
$('startCam').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = $('video');
    video.srcObject = stream; await video.play();
    scanning = true;
    const canvas = document.createElement('canvas');
    const tick = () => {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const c = canvas.getContext('2d');
        c.drawImage(video, 0, 0);
        const img = c.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height);
        if (code && code.data) { stopCam(); onScan(code.data); return; }
      }
      requestAnimationFrame(tick);
    };
    tick();
  } catch { alert('No se pudo abrir la cámara. Usa el campo manual.'); }
};
function stopCam() { scanning = false; if (stream) stream.getTracks().forEach(t => t.stop()); }
$('manualBtn').onclick = () => { const v = $('manual').value.trim(); if (v) onScan(v); };
$('againBtn').onclick = () => { $('result').classList.add('hidden'); $('scanner').classList.remove('hidden'); $('resMsg').innerHTML = ''; };

async function onScan(qr) {
  try {
    const info = await api('/api/scan', { method: 'POST', body: JSON.stringify({ qr }) });
    current = { qr, info }; qty = {};
    $('scanner').classList.add('hidden'); $('result').classList.remove('hidden');
    $('photo').src = info.photoUrl || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" fill="#161b26"/><text x="48" y="56" font-size="30" text-anchor="middle" fill="#555">?</text></svg>');
    $('pname').textContent = (info.name || 'Sin nombre') + (info.role === 'socio' || info.role === 'admin' ? ' — SOCIO' : '');
    $('phost').textContent = info.hostName ? 'Invita: ' + info.hostName : '';
    $('pbadge').className = 'badge ' + (info.ok ? 'b-ok' : 'b-bad');
    $('pbadge').textContent = info.ok ? 'ACCESO OK' : 'SIN ACCESO';
    $('preason').textContent = info.reason;
    $('doorActions').classList.toggle('hidden', !(me.role === 'puerta' || me.role === 'admin') || !info.ok);
    const waiter = (me.role === 'mesero' || me.role === 'admin') && info.ok;
    $('waiterActions').classList.toggle('hidden', !waiter);
    if (waiter) renderOrder(info);
  } catch (e) {
    $('scanner').classList.add('hidden'); $('result').classList.remove('hidden');
    $('photo').removeAttribute('src'); $('pname').textContent = 'QR rechazado';
    $('phost').textContent = ''; $('pbadge').className = 'badge b-bad'; $('pbadge').textContent = 'INVÁLIDO';
    $('preason').textContent = e.message;
    $('doorActions').classList.add('hidden'); $('waiterActions').classList.add('hidden');
  }
}

const CAT_LABELS = { cerveza:'Cervezas', vino:'Vinos', refresco:'Refrescos', copa:'Copas', botella:'Botellas', comida:'Comida', general:'Otros' };
let currentCat = null;

function renderOrder(info) {
  $('limits').textContent = info.remainingCents === null
    ? 'Consumo sin límite (a cuenta del socio)'
    : `Disponible: ${eur(info.remainingCents)} de ${eur(info.spendLimitCents)}`;

  // Pestañas de categoría
  const cats = [...new Set(products.map(p => p.category))];
  currentCat = cats[0] ?? null;
  const catsBox = $('cats'); catsBox.innerHTML = '';
  for (const c of cats) {
    const b = document.createElement('button');
    b.textContent = CAT_LABELS[c] ?? c;
    b.dataset.cat = c;
    if (c === currentCat) b.classList.add('on');
    b.onclick = () => {
      currentCat = c;
      catsBox.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.cat === c));
      renderGrid();
    };
    catsBox.appendChild(b);
  }
  renderGrid();
  renderTicket();
}

// Cuadrícula: tocar un producto lo añade a la comanda
function renderGrid() {
  const box = $('products'); box.innerHTML = '';
  if (products.length === 0) { box.innerHTML = '<p class="muted">La carta está vacía: añádela desde el panel.</p>'; return; }
  for (const p of products.filter(x => x.category === currentCat)) {
    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.innerHTML = `<span>${p.name}</span><span class="price">${eur(p.price_cents)}</span>`;
    if (qty[p.id]) tile.innerHTML += `<span class="n">${qty[p.id]}</span>`;
    tile.onclick = () => { qty[p.id] = (qty[p.id] || 0) + 1; renderGrid(); renderTicket(); };
    box.appendChild(tile);
  }
}

// Comanda: lo seleccionado, con cantidades y quitar
function renderTicket() {
  const box = $('ticket'); box.innerHTML = '';
  const selected = products.filter(p => qty[p.id] > 0);
  if (selected.length === 0) {
    box.innerHTML = '<p class="muted">Toca un producto para añadirlo.</p>';
  }
  for (const p of selected) {
    const row = document.createElement('div'); row.className = 'trow';
    row.innerHTML = `<div class="tname">${p.name}</div>
      <span class="tsum">${qty[p.id]} × ${eur(p.price_cents)}</span>
      <div class="stepper"><button>−</button><b>${qty[p.id]}</b><button>＋</button></div>`;
    const [minus, plus] = row.querySelectorAll('button');
    minus.onclick = () => { qty[p.id] = Math.max(0, qty[p.id] - 1); renderGrid(); renderTicket(); };
    plus.onclick = () => { qty[p.id]++; renderGrid(); renderTicket(); };
    box.appendChild(row);
  }
  let t = 0;
  for (const p of products) t += (qty[p.id] || 0) * p.price_cents;
  $('total').textContent = eur(t);
  $('orderBtn').style.display = selected.length ? '' : 'none';
}

$('checkinBtn').onclick = async () => {
  try {
    const r = await api('/api/checkin', { method: 'POST', body: JSON.stringify({ qr: current.qr }) });
    $('resMsg').innerHTML = `<p class="okmsg">Entrada registrada: ${r.name}</p>`;
    $('doorActions').classList.add('hidden');
  } catch (e) { $('resMsg').innerHTML = `<p class="err">${e.message}</p>`; }
};

$('orderBtn').onclick = async () => {
  const items = Object.entries(qty).filter(([, q]) => q > 0).map(([productId, q]) => ({ productId: Number(productId), qty: q }));
  if (items.length === 0) return;
  try {
    const r = await api('/api/orders', { method: 'POST', body: JSON.stringify({ qr: current.qr, items }) });
    $('resMsg').innerHTML = `<p class="okmsg">${eur(r.totalCents)} cargados a la cuenta de ${r.socioName ?? 'socio'} · comanda #${r.orderId}</p>`;
    $('waiterActions').classList.add('hidden');
  } catch (e) { $('resMsg').innerHTML = `<p class="err">${e.message}</p>`; }
};

init();
</script>
</body>
</html>
