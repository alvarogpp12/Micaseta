<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Escáner — Micaseta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1117; --card:#161b26; --card2:#1d2432; --border:#252c3b; --text:#f2f4f8; --muted:#8b93a5;
    --primary:#5b6cff; --primary-dark:#4353f0; --primary-soft:rgba(91,108,255,.16);
    --ok:#12b76a; --danger:#f04438;
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; touch-action:manipulation; overflow-x:hidden; min-height:100vh; }
  header { padding:13px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20; }
  .wordmark { font-weight:800; font-size:16px; letter-spacing:-.03em; }
  .wordmark i { color:var(--primary); font-style:normal; }
  header span.who { color:var(--muted); font-size:13px; font-weight:500; }
  main { padding:14px 14px 120px; max-width:480px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
  video { width:100%; border-radius:10px; background:#000; }
  .btn { border:0; border-radius:11px; padding:14px 16px; font:700 15px Inter,sans-serif; cursor:pointer; width:100%; margin-top:10px; }
  .primary { background:var(--primary); color:#fff; }
  .good { background:var(--ok); color:#fff; }
  .ghost { background:transparent; color:var(--text); border:1px solid var(--border); font-weight:600; }
  .hidden { display:none !important; }
  input[type=text] { width:100%; padding:12px; border-radius:9px; border:1px solid var(--border); background:#0d1117; color:var(--text); font:400 16px Inter,sans-serif; outline:none; }
  input[type=text]:focus { border-color:var(--primary); }
  label.small { display:block; color:var(--muted); font:600 12px Inter,sans-serif; margin:12px 0 6px; }
  .err { color:#ff7a70; font:600 13.5px Inter,sans-serif; margin-top:10px; }

  /* Persona escaneada */
  .person { display:flex; align-items:center; gap:13px; }
  .person img { width:74px; height:74px; border-radius:12px; object-fit:cover; background:#0d1117; border:1px solid var(--border); flex-shrink:0; }
  .person .pinfo { min-width:0; flex:1; }
  .person .pname { font-size:16.5px; font-weight:700; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .person .phost { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .badge { display:inline-block; padding:3px 11px; border-radius:99px; font:700 12px Inter,sans-serif; margin-top:6px; }
  .b-ok { background:rgba(18,183,106,.15); color:#3ddc93; border:1px solid rgba(18,183,106,.4); }
  .b-bad { background:rgba(240,68,56,.12); color:#ff7a70; border:1px solid rgba(240,68,56,.4); }
  .preason { color:var(--muted); font-size:12.5px; margin-top:5px; }
  .limitbar { margin-top:12px; background:var(--card2); border-radius:9px; padding:9px 12px; font:600 13px Inter,sans-serif; color:var(--muted); }
  .limitbar b { color:var(--text); }

  /* Categorías */
  .cats { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch; scrollbar-width:none; position:sticky; top:53px; background:var(--bg); z-index:15; }
  .cats::-webkit-scrollbar { display:none; }
  .cats button { border:0; cursor:pointer; flex-shrink:0; padding:10px 15px; border-radius:99px; font:700 13.5px Inter,sans-serif; background:var(--card2); color:var(--muted); }
  .cats button.on { background:var(--primary); color:#fff; }

  /* Productos: tocar añade, el − sobre el producto quita */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { position:relative; border:1.5px solid var(--border); border-radius:13px; background:var(--card); padding:13px 12px 11px; min-height:82px; cursor:pointer; display:flex; flex-direction:column; user-select:none; }
  .tile .tn { font:600 14px/1.3 Inter,sans-serif; padding-right:26px; }
  .tile .tp { color:var(--muted); font:600 13px Inter,sans-serif; margin-top:auto; padding-top:8px; }
  .tile.sel { border-color:var(--primary); background:var(--primary-soft); }
  .tile.sel .tp { color:#aab4ff; }
  .tile .qty { position:absolute; top:-8px; right:-6px; background:var(--primary); color:#fff; min-width:26px; height:26px; border-radius:99px; display:grid; place-items:center; font:800 13.5px Inter,sans-serif; padding:0 7px; box-shadow:0 2px 8px rgba(0,0,0,.45); }
  .tile .rm { position:absolute; bottom:8px; right:8px; width:34px; height:34px; border-radius:99px; border:1px solid var(--border); background:var(--card2); color:var(--text); font:700 19px/1 Inter,sans-serif; display:grid; place-items:center; cursor:pointer; }
  .tile.bump { animation:bump .18s ease; }
  @keyframes bump { 50% { transform:scale(.96); } }

  /* Barra inferior fija con la comanda */
  .cartbar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card); border-top:1px solid var(--border); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .cartbar-in { max-width:480px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .cartbar .info { flex:1; min-width:0; }
  .cartbar .info .n { color:var(--muted); font:600 12.5px Inter,sans-serif; }
  .cartbar .info .t { font:800 19px Inter,sans-serif; letter-spacing:-.01em; }
  .cartbar .btn { width:auto; margin:0; padding:13px 22px; }

  /* Hoja de comanda */
  .sheet-back { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--card); border-radius:18px 18px 0 0; border:1px solid var(--border); border-bottom:0; max-height:78vh; display:flex; flex-direction:column; }
  .sheet-in { max-width:480px; margin:0 auto; width:100%; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; min-height:0; }
  .sheet h3 { font-size:16px; letter-spacing:-.01em; }
  .sheet .sub { color:var(--muted); font-size:13px; margin:3px 0 10px; }
  .lines { overflow-y:auto; min-height:0; }
  .line { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .line:last-child { border-bottom:0; }
  .line .ln { flex:1; min-width:0; font:500 14.5px Inter,sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .line .lp { color:var(--muted); font-size:13px; white-space:nowrap; }
  .stepper { display:flex; align-items:center; gap:2px; background:var(--card2); border-radius:99px; padding:3px; }
  .stepper button { border:0; cursor:pointer; width:32px; height:32px; border-radius:99px; background:transparent; color:var(--text); font:700 18px/1 Inter,sans-serif; }
  .stepper button:active { background:var(--primary); }
  .stepper b { min-width:22px; text-align:center; font-size:14.5px; }
  .sheet .totalrow { display:flex; justify-content:space-between; align-items:center; padding:14px 0 4px; font:800 18px Inter,sans-serif; }

  /* Éxito */
  .done { text-align:center; padding:34px 16px 26px; }
  .done .ck { width:64px; height:64px; border-radius:99px; background:rgba(18,183,106,.15); border:1px solid rgba(18,183,106,.4); display:grid; place-items:center; margin:0 auto 14px; }
  .done .ck svg { width:30px; height:30px; color:#3ddc93; }
  .done .amt { font:800 24px Inter,sans-serif; letter-spacing:-.02em; }
  .done .to { color:var(--muted); font-size:14px; margin-top:5px; }
  .okmsg { color:#3ddc93; font:700 14px Inter,sans-serif; margin-top:12px; }
  #demoBtns .btn { text-align:left; font-size:14px; font-weight:600; }
</style>
</head>
<body>
<header><span class="wordmark">micaseta<i>.</i></span><span class="who" id="who">…</span></header>
<main>
  <div id="login" class="card hidden">
    <p style="font-size:14.5px;line-height:1.6">Sesión no válida. Pide al responsable de la caseta que te reenvíe tu enlace de acceso.</p>
  </div>

  <!-- Escáner -->
  <div id="scanner" class="card hidden">
    <video id="video" playsinline class="hidden"></video>
    <button class="btn primary" id="startCam" style="margin-top:0">Escanear código QR</button>
    <label class="small">O introduce el código manualmente</label>
    <input type="text" id="manual" placeholder="Código del QR">
    <button class="btn ghost" id="manualBtn">Comprobar</button>
    <div id="demoZone" class="hidden">
      <label class="small">Modo demo — simula el escaneo de una persona</label>
      <div id="demoBtns"></div>
    </div>
  </div>

  <!-- Persona escaneada -->
  <div id="personCard" class="card hidden">
    <div class="person">
      <img id="photo" alt="Foto">
      <div class="pinfo">
        <div class="pname" id="pname"></div>
        <div class="phost" id="phost"></div>
        <span id="pbadge" class="badge"></span>
        <div class="preason" id="preason"></div>
      </div>
    </div>
    <div id="limitbar" class="limitbar hidden"></div>
    <div id="doorActions" class="hidden">
      <button class="btn good" id="checkinBtn">Registrar entrada</button>
    </div>
    <div id="resMsg"></div>
    <button class="btn ghost" id="againBtn">Escanear otro</button>
  </div>

  <!-- TPV del camarero -->
  <div id="waiterActions" class="hidden">
    <div class="cats" id="cats"></div>
    <div class="grid" id="products"></div>
  </div>

  <!-- Éxito -->
  <div id="doneCard" class="card done hidden">
    <div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <div class="amt" id="doneAmt"></div>
    <div class="to" id="doneTo"></div>
    <button class="btn primary" id="doneAgain" style="margin-top:20px">Escanear otro</button>
  </div>
</main>

<!-- Barra inferior: total de la comanda -->
<div class="cartbar hidden" id="cartbar">
  <div class="cartbar-in">
    <div class="info"><div class="n" id="cartN"></div><div class="t" id="cartT"></div></div>
    <button class="btn primary" id="openSheet">Ver comanda</button>
  </div>
</div>

<!-- Hoja de comanda -->
<div class="sheet-back hidden" id="sheetBack"></div>
<div class="sheet hidden" id="sheet">
  <div class="sheet-in">
    <h3>Comanda</h3>
    <div class="sub" id="sheetSub"></div>
    <div class="lines" id="lines"></div>
    <div class="totalrow"><span>Total</span><span id="sheetTotal"></span></div>
    <button class="btn good" id="orderBtn"></button>
    <button class="btn ghost" id="keepBtn">Seguir pidiendo</button>
    <div class="err" id="sheetErr"></div>
  </div>
</div>

<script src="/vendor/jsQR.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const eur = (c) => (c / 100).toFixed(2).replace('.', ',') + ' €';
let me = null, current = null, products = [], qty = {}, currentCat = null;
const CAT_LABELS = { cerveza:'Cervezas', vino:'Vinos', refresco:'Refrescos', copa:'Copas', botella:'Botellas', comida:'Comida', general:'Otros' };

async function api(path, opts) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || 'Error');
  return body;
}

async function init() {
  try {
    me = await api('/api/me');
    $('who').textContent = `${me.name} · ${me.role === 'puerta' ? 'Puerta' : 'Camarero'}`;
    $('scanner').classList.remove('hidden');
    if (me.role !== 'puerta') {
      products = await api('/api/products');
      const ORDER = ['cerveza','vino','refresco','copa','botella','comida'];
      products.sort((a, b) => (ORDER.indexOf(a.category) - ORDER.indexOf(b.category)) || a.name.localeCompare(b.name));
    }
    try {
      const demos = await api('/api/demo-qrs');
      if (Array.isArray(demos) && demos.length) {
        $('demoZone').classList.remove('hidden');
        for (const d of demos) {
          const b = document.createElement('button');
          b.className = 'btn ghost'; b.textContent = d.label;
          b.onclick = () => onScan(d.token);
          $('demoBtns').appendChild(b);
        }
      }
    } catch {}
  } catch { $('login').classList.remove('hidden'); }
}

// ---- Escaneo ----
let stream = null, scanning = false;
$('startCam').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = $('video');
    video.classList.remove('hidden');
    video.srcObject = stream; await video.play();
    scanning = true;
    const canvas = document.createElement('canvas');
    const tick = () => {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const c = canvas.getContext('2d');
        c.drawImage(video, 0, 0);
        const img = c.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height);
        if (code && code.data) { stopCam(); onScan(code.data); return; }
      }
      requestAnimationFrame(tick);
    };
    tick();
  } catch { alert('No se pudo abrir la cámara. Usa el campo manual.'); }
};
function stopCam() { scanning = false; if (stream) stream.getTracks().forEach(t => t.stop()); $('video').classList.add('hidden'); }
$('manualBtn').onclick = () => { const v = $('manual').value.trim(); if (v) onScan(v); };

function resetToScanner() {
  ['personCard','waiterActions','doneCard','cartbar'].forEach(id => $(id).classList.add('hidden'));
  closeSheet();
  $('resMsg').innerHTML = '';
  $('scanner').classList.remove('hidden');
  current = null; qty = {};
}
$('againBtn').onclick = resetToScanner;
$('doneAgain').onclick = resetToScanner;

// ---- Resultado del escaneo ----
async function onScan(qrToken) {
  let info;
  try {
    info = await api('/api/scan', { method: 'POST', body: JSON.stringify({ qr: qrToken }) });
  } catch (e) {
    showPerson({ name: 'QR rechazado', ok: false, reason: e.message, photoUrl: null, hostName: null });
    return;
  }
  current = { qr: qrToken, info }; qty = {};
  showPerson(info);
  const isWaiter = (me.role === 'mesero' || me.role === 'admin');
  if (isWaiter && info.ok) {
    $('waiterActions').classList.remove('hidden');
    $('cartbar').classList.remove('hidden');
    renderCats(); renderGrid(); updateCart();
    if (info.remainingCents !== null) {
      $('limitbar').classList.remove('hidden');
      $('limitbar').innerHTML = `Disponible: <b>${eur(info.remainingCents)}</b> de ${eur(info.spendLimitCents)}`;
    }
  }
  if ((me.role === 'puerta' || me.role === 'admin') && info.ok) {
    $('doorActions').classList.remove('hidden');
  }
}

function showPerson(info) {
  $('scanner').classList.add('hidden');
  $('personCard').classList.remove('hidden');
  $('doorActions').classList.add('hidden');
  $('limitbar').classList.add('hidden');
  $('photo').src = info.photoUrl || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="74" height="74"><rect width="74" height="74" fill="#1d2432"/><text x="37" y="46" font-size="26" text-anchor="middle" fill="#555">?</text></svg>');
  $('pname').textContent = (info.name || 'Sin nombre') + (info.role === 'socio' || info.role === 'admin' ? ' · SOCIO' : '');
  $('phost').textContent = info.hostName ? 'Invita: ' + info.hostName : '';
  $('pbadge').className = 'badge ' + (info.ok ? 'b-ok' : 'b-bad');
  $('pbadge').textContent = info.ok ? 'ACCESO OK' : 'SIN ACCESO';
  $('preason').textContent = info.reason ?? '';
}

// ---- Puerta ----
$('checkinBtn').onclick = async () => {
  try {
    const r = await api('/api/checkin', { method: 'POST', body: JSON.stringify({ qr: current.qr }) });
    $('resMsg').innerHTML = `<p class="okmsg">Entrada registrada: ${r.name}</p>`;
    $('doorActions').classList.add('hidden');
  } catch (e) { $('resMsg').innerHTML = `<p class="err">${e.message}</p>`; }
};

// ---- TPV: tocar añade, − en el producto quita ----
function renderCats() {
  const cats = [...new Set(products.map(p => p.category))];
  if (!cats.includes(currentCat)) currentCat = cats[0] ?? null;
  const box = $('cats'); box.innerHTML = '';
  for (const c of cats) {
    const b = document.createElement('button');
    b.textContent = CAT_LABELS[c] ?? c;
    if (c === currentCat) b.classList.add('on');
    b.onclick = () => { currentCat = c; renderCats(); renderGrid(); };
    box.appendChild(b);
  }
}

function renderGrid() {
  const box = $('products'); box.innerHTML = '';
  if (products.length === 0) { box.innerHTML = '<p style="color:var(--muted);font-size:14px">La carta está vacía: añádela desde el panel.</p>'; return; }
  for (const p of products.filter(x => x.category === currentCat)) {
    const n = qty[p.id] || 0;
    const tile = document.createElement('div');
    tile.className = 'tile' + (n ? ' sel' : '');
    tile.innerHTML = `<span class="tn">${p.name}</span><span class="tp">${eur(p.price_cents)}</span>
      ${n ? `<span class="qty">${n}</span><button class="rm" aria-label="Quitar uno">−</button>` : ''}`;
    tile.onclick = (ev) => {
      if (ev.target.classList.contains('rm')) return;
      qty[p.id] = (qty[p.id] || 0) + 1;
      tile.classList.add('bump');
      renderGrid(); updateCart();
    };
    const rm = tile.querySelector('.rm');
    if (rm) rm.onclick = (ev) => { ev.stopPropagation(); qty[p.id] = Math.max(0, (qty[p.id] || 0) - 1); renderGrid(); updateCart(); };
    box.appendChild(tile);
  }
}

function cartCount() { return Object.values(qty).reduce((a, b) => a + b, 0); }
function cartTotal() { let t = 0; for (const p of products) t += (qty[p.id] || 0) * p.price_cents; return t; }

function updateCart() {
  const n = cartCount();
  $('cartN').textContent = n === 0 ? 'Toca productos para añadirlos' : `${n} artículo${n === 1 ? '' : 's'}`;
  $('cartT').textContent = eur(cartTotal());
  $('openSheet').disabled = n === 0;
  $('openSheet').style.opacity = n === 0 ? '.45' : '1';
}

// ---- Hoja de comanda ----
function openSheet() {
  if (cartCount() === 0) return;
  renderSheet();
  $('sheet').classList.remove('hidden');
  $('sheetBack').classList.remove('hidden');
}
function closeSheet() { $('sheet').classList.add('hidden'); $('sheetBack').classList.add('hidden'); $('sheetErr').textContent = ''; }
$('openSheet').onclick = openSheet;
$('keepBtn').onclick = closeSheet;
$('sheetBack').onclick = closeSheet;

function renderSheet() {
  const socio = current?.info?.hostName ?? (current?.info?.role === 'socio' ? current.info.name : null);
  $('sheetSub').textContent = socio ? `A la cuenta de ${socio}` : 'A la cuenta del socio';
  $('orderBtn').textContent = socio ? `Cargar a la cuenta de ${socio}` : 'Cargar a la cuenta del socio';
  const box = $('lines'); box.innerHTML = '';
  for (const p of products.filter(x => qty[x.id] > 0)) {
    const line = document.createElement('div'); line.className = 'line';
    line.innerHTML = `<div class="ln">${p.name}<div class="lp">${eur(p.price_cents)} / ud</div></div>
      <div class="stepper"><button>−</button><b>${qty[p.id]}</b><button>＋</button></div>
      <span class="lp" style="min-width:58px;text-align:right">${eur(qty[p.id] * p.price_cents)}</span>`;
    const [minus, plus] = line.querySelectorAll('button');
    minus.onclick = () => { qty[p.id] = Math.max(0, qty[p.id] - 1); afterSheetChange(); };
    plus.onclick = () => { qty[p.id]++; afterSheetChange(); };
    box.appendChild(line);
  }
  $('sheetTotal').textContent = eur(cartTotal());
}
function afterSheetChange() {
  renderGrid(); updateCart();
  if (cartCount() === 0) closeSheet(); else renderSheet();
}

$('orderBtn').onclick = async () => {
  const items = Object.entries(qty).filter(([, q]) => q > 0).map(([productId, q]) => ({ productId: Number(productId), qty: q }));
  if (items.length === 0) return;
  $('orderBtn').disabled = true;
  try {
    const r = await api('/api/orders', { method: 'POST', body: JSON.stringify({ qr: current.qr, items }) });
    closeSheet();
    ['personCard','waiterActions','cartbar'].forEach(id => $(id).classList.add('hidden'));
    $('doneCard').classList.remove('hidden');
    $('doneAmt').textContent = eur(r.totalCents);
    $('doneTo').textContent = `cargados a la cuenta de ${r.socioName ?? 'socio'} · comanda #${r.orderId}`;
    qty = {};
  } catch (e) {
    $('sheetErr').textContent = e.message;
  } finally {
    $('orderBtn').disabled = false;
  }
};

init();
</script>
</body>
</html>
