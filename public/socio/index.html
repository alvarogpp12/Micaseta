<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mi caseta — Micaseta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f6fa; --surface:#ffffff; --border:#e6e8f0; --text:#101828; --muted:#667085;
    --primary:#4353ff; --primary-dark:#3543d9; --primary-soft:#eef0ff;
    --ok:#12b76a; --danger:#f04438; --danger-soft:#feeceb;
    --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.06);
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; touch-action:manipulation; overflow-x:hidden; }
  body.menu-open { padding-bottom:110px; }
  .wrap { max-width:420px; margin:0 auto; padding:24px 16px 60px; }
  .wordmark { text-align:center; font-weight:800; font-size:15px; letter-spacing:-.03em; color:var(--muted); margin-bottom:16px; }
  .wordmark i { color:var(--primary); font-style:normal; }
  .head { background:linear-gradient(120deg, var(--primary), #6e3aff); color:#fff; border-radius:var(--radius); padding:22px; }
  .head .k { font:600 12px Inter,sans-serif; opacity:.85; text-transform:uppercase; letter-spacing:.06em; }
  .head h1 { font-size:22px; font-weight:800; letter-spacing:-.02em; margin-top:4px; overflow-wrap:break-word; }
  .head .sub { font-size:13.5px; opacity:.9; margin-top:6px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-top:14px; }
  .qrframe { background:#fff; border:1px solid var(--border); border-radius:14px; padding:12px; }
  .qrframe img { width:100%; display:block; }
  .mut { color:var(--muted); font-size:13.5px; line-height:1.55; }
  .btn { width:100%; border:0; border-radius:11px; padding:14px; font:700 15px Inter,sans-serif; cursor:pointer; margin-top:12px; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-sec { background:var(--surface); color:var(--text); border:1px solid var(--border); font-weight:600; }
  .err { color:var(--danger); font:600 13.5px Inter,sans-serif; margin-top:8px; min-height:18px; }
  .dead { background:var(--danger-soft); color:#b42318; border-radius:12px; padding:16px; text-align:center; font-weight:600; font-size:14.5px; }
  .hidden { display:none !important; }
  .center { text-align:center; }
  /* Menú interactivo (idéntico al TPV) */
  .cats { display:flex; gap:8px; overflow-x:auto; padding:12px 0 10px; scrollbar-width:none; }
  .cats::-webkit-scrollbar { display:none; }
  .cats button { border:0; cursor:pointer; flex-shrink:0; padding:9px 15px; border-radius:99px; font:700 13.5px Inter,sans-serif; background:var(--primary-soft); color:var(--primary); }
  .cats button.on { background:var(--primary); color:#fff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { position:relative; border:1.5px solid var(--border); border-radius:13px; background:#fff; padding:12px 12px 10px; min-height:92px; cursor:pointer; display:flex; flex-direction:column; user-select:none; text-align:left; }
  .tile .tn { font:600 14px/1.3 Inter,sans-serif; padding-right:22px; overflow-wrap:break-word; }
  .tile .tp { color:var(--muted); font:600 13px Inter,sans-serif; margin-top:auto; padding-top:8px; padding-right:78px; }
  .tile.sel { border-color:var(--primary); background:var(--primary-soft); }
  .tile .qn { position:absolute; top:-8px; right:-6px; background:var(--primary); color:#fff; min-width:25px; height:25px; border-radius:99px; display:grid; place-items:center; font:800 13px Inter,sans-serif; padding:0 7px; box-shadow:0 2px 6px rgba(16,24,40,.25); }
  .tstep { position:absolute; bottom:8px; right:8px; display:flex; gap:6px; }
  .tstep button { width:33px; height:33px; border-radius:99px; border:1px solid var(--border); background:#fff; color:var(--text); font:700 18px/1 Inter,sans-serif; display:grid; place-items:center; cursor:pointer; padding:0; margin:0; }
  .tstep .ad { background:var(--primary); border-color:var(--primary); color:#fff; }
  .cartbar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:1px solid var(--border); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow:0 -4px 16px rgba(16,24,40,.07); }
  .cartbar-in { max-width:420px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .cinfo { flex:1; min-width:0; }
  .cn { color:var(--muted); font:600 12.5px Inter,sans-serif; }
  .ct { font:800 19px Inter,sans-serif; letter-spacing:-.01em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">micaseta<i>.</i></div>
  <div id="dead" class="dead hidden"></div>

  <div id="home" class="hidden">
    <div class="head">
      <div class="k">Socio</div>
      <h1 id="sName"></h1>
      <div class="sub" id="sCaseta"></div>
    </div>
    <div class="card center">
      <p class="mut" style="margin-bottom:12px">Tu código para entrar y pedir. Preséntalo en la puerta y al camarero.</p>
      <div class="qrframe"><img id="qrImg" alt="Tu código QR de socio"></div>
      <p class="mut" id="sPend" style="margin-top:12px"></p>
    </div>
    <button class="btn btn-primary" id="openMenu">Pedir desde el móvil</button>
  </div>

  <div id="menu" class="hidden">
    <div class="card" style="padding:16px">
      <h3 style="font-size:16px">Haz tu pedido</h3>
      <p class="mut" id="menuSub"></p>
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div id="sent" class="hidden">
    <div class="card center">
      <h3 id="sentTitle" style="font-size:18px"></h3>
      <p class="mut" id="sentSub" style="margin-top:6px"></p>
      <button class="btn btn-sec" id="sentBack" style="margin-top:14px">Volver a mi QR</button>
    </div>
  </div>
</div>

<div class="cartbar hidden" id="cartbar">
  <div class="cartbar-in">
    <div class="cinfo"><div class="cn" id="cartN"></div><div class="ct" id="cartT"></div></div>
    <button class="btn btn-primary" id="sendOrder" style="width:auto;margin:0;padding:13px 20px">Enviar pedido</button>
  </div>
  <div class="err" id="cartErr" style="max-width:420px;margin:0 auto"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const t = new URLSearchParams(location.search).get('t') ?? '';
const eur = (c) => (c/100).toLocaleString('es-ES', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
const CAT_LABELS = { cerveza:'Cervezas', vino:'Vinos', refresco:'Refrescos', copa:'Copas', botella:'Botellas', comida:'Comida', general:'Otros' };
let info = null, qty = {}, cat = null;

async function load() {
  const r = await fetch('/gapi/socio?t=' + encodeURIComponent(t));
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { $('dead').textContent = data.error || 'Este enlace no es válido.'; $('dead').classList.remove('hidden'); return; }
  info = data;
  const ORDER = ['cerveza','vino','refresco','copa','botella','comida'];
  info.products.sort((a, b) => (ORDER.indexOf(a.category) - ORDER.indexOf(b.category)) || a.name.localeCompare(b.name));
  $('sName').textContent = info.name ?? 'Socio';
  $('sCaseta').textContent = info.caseta;
  $('qrImg').src = '/qr.png?t=' + encodeURIComponent(info.qrToken);
  $('sPend').textContent = info.pendingCents > 0 ? `Cuenta pendiente: ${eur(info.pendingCents)}` : 'No tienes consumo pendiente.';
  $('home').classList.remove('hidden');
}

$('openMenu').onclick = () => {
  $('home').classList.add('hidden');
  $('menu').classList.remove('hidden');
  $('cartbar').classList.remove('hidden');
  document.body.classList.add('menu-open');
  $('menuSub').textContent = 'A tu cuenta de socio · sin límite';
  renderCats(); renderGrid(); updateCart();
};

function renderCats() {
  const cats = [...new Set(info.products.map(p => p.category))];
  if (!cats.includes(cat)) cat = cats[0] ?? null;
  const box = $('cats'); box.innerHTML = '';
  for (const c of cats) {
    const b = document.createElement('button');
    b.textContent = CAT_LABELS[c] ?? c;
    if (c === cat) b.classList.add('on');
    b.onclick = () => { cat = c; renderCats(); renderGrid(); };
    box.appendChild(b);
  }
}

function renderGrid() {
  const box = $('grid'); box.innerHTML = '';
  for (const p of info.products.filter(x => x.category === cat)) {
    const n = qty[p.id] || 0;
    const tile = document.createElement('div');
    tile.className = 'tile' + (n ? ' sel' : '');
    tile.innerHTML = `<span class="tn">${p.name}</span><span class="tp">${eur(p.price_cents)}</span>
      ${n ? `<span class="qn">${n}</span><div class="tstep"><button class="rm">−</button><button class="ad">＋</button></div>` : ''}`;
    const add = () => { qty[p.id] = (qty[p.id] || 0) + 1; renderGrid(); updateCart(); };
    tile.onclick = (ev) => { if (ev.target.closest('.tstep')) return; add(); };
    const rm = tile.querySelector('.rm');
    if (rm) rm.onclick = (ev) => { ev.stopPropagation(); qty[p.id] = Math.max(0, (qty[p.id] || 0) - 1); renderGrid(); updateCart(); };
    const ad = tile.querySelector('.ad');
    if (ad) ad.onclick = (ev) => { ev.stopPropagation(); add(); };
    box.appendChild(tile);
  }
}

function updateCart() {
  const n = Object.values(qty).reduce((a, b) => a + b, 0);
  let total = 0;
  for (const p of info.products) total += (qty[p.id] || 0) * p.price_cents;
  $('cartN').textContent = n === 0 ? 'Toca productos para añadirlos' : `${n} artículo${n === 1 ? '' : 's'}`;
  $('cartT').textContent = eur(total);
  $('sendOrder').disabled = n === 0;
  $('sendOrder').style.opacity = n === 0 ? '.45' : '1';
}

$('sendOrder').onclick = async () => {
  const items = Object.entries(qty).filter(([, q]) => q > 0).map(([productId, q]) => ({ productId: Number(productId), qty: q }));
  if (!items.length) return;
  $('sendOrder').disabled = true; $('cartErr').textContent = '';
  const r = await fetch('/gapi/socio/pedido', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ t, items }) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { $('cartErr').textContent = data.error || 'Error'; $('sendOrder').disabled = false; return; }
  qty = {};
  $('menu').classList.add('hidden'); $('cartbar').classList.add('hidden');
  document.body.classList.remove('menu-open');
  $('sent').classList.remove('hidden');
  $('sentTitle').textContent = `Pedido enviado · ${eur(data.totalCents)}`;
  $('sentSub').textContent = 'El camarero lo tiene en pantalla. Va a tu cuenta de socio.';
  $('sendOrder').disabled = false;
};
$('sentBack').onclick = () => { $('sent').classList.add('hidden'); $('home').classList.remove('hidden'); load(); };

load();
</script>
</body>
</html>
