<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mi caseta — Micaseta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f6fa; --surface:#ffffff; --border:#e6e8f0; --text:#101828; --muted:#667085;
    --primary:#4353ff; --primary-dark:#3543d9; --primary-soft:#eef0ff;
    --ok:#12b76a; --ok-soft:#e7f8f0; --danger:#f04438; --danger-soft:#feeceb; --gray-soft:#f2f4f7;
    --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.06);
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; touch-action:manipulation; overflow-x:hidden; padding-bottom:86px; }
  .wrap { max-width:420px; margin:0 auto; padding:20px 16px 40px; }
  .wordmark { text-align:center; font-weight:800; font-size:15px; letter-spacing:-.03em; color:var(--muted); margin-bottom:14px; }
  .wordmark i { color:var(--primary); font-style:normal; }
  .head { background:linear-gradient(120deg, var(--primary), #6e3aff); color:#fff; border-radius:var(--radius); padding:20px 22px; }
  .head .k { font:600 12px Inter,sans-serif; opacity:.85; text-transform:uppercase; letter-spacing:.06em; }
  .head h1 { font-size:21px; font-weight:800; letter-spacing:-.02em; margin-top:3px; overflow-wrap:break-word; }
  .head .sub { font-size:13.5px; opacity:.9; margin-top:5px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-top:14px; }
  .qrframe { background:#fff; border:1px solid var(--border); border-radius:14px; padding:12px; }
  .qrframe img { width:100%; display:block; }
  .mut { color:var(--muted); font-size:13.5px; line-height:1.55; }
  .btn { width:100%; border:0; border-radius:11px; padding:14px; font:700 15px Inter,sans-serif; cursor:pointer; margin-top:12px; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-sec { background:var(--surface); color:var(--text); border:1px solid var(--border); font-weight:600; }
  .btn-mini { width:auto; margin:0; padding:8px 12px; font-size:13px; border-radius:8px; }
  .err { color:var(--danger); font:600 13.5px Inter,sans-serif; margin-top:8px; min-height:18px; }
  .dead { background:var(--danger-soft); color:#b42318; border-radius:12px; padding:16px; text-align:center; font-weight:600; font-size:14.5px; }
  .warn { background:#fff8e6; color:#93630c; border:1px solid #f4dfa8; border-radius:12px; padding:12px 14px; font:600 13px Inter,sans-serif; margin-top:12px; }
  .hidden { display:none !important; }
  .center { text-align:center; }
  label { display:block; font:600 12.5px Inter,sans-serif; color:#344054; margin:12px 0 5px; }
  input { width:100%; padding:11px 13px; border-radius:9px; border:1px solid #d0d5dd; background:#fff; color:var(--text); font:400 16px Inter,sans-serif; outline:none; }
  input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(67,83,255,.12); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* Nav inferior */
  nav { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); z-index:20; }
  .nav-in { max-width:420px; margin:0 auto; display:flex; }
  nav button { flex:1; background:none; border:0; color:var(--muted); font:600 10.5px Inter,sans-serif; padding:9px 2px calc(10px + env(safe-area-inset-bottom)); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  nav button svg { width:21px; height:21px; }
  nav button.on { color:var(--primary); }

  /* Carta */
  .cats { display:flex; gap:8px; overflow-x:auto; padding:12px 0 10px; scrollbar-width:none; }
  .cats::-webkit-scrollbar { display:none; }
  .cats button { border:0; cursor:pointer; flex-shrink:0; padding:9px 15px; border-radius:99px; font:700 13.5px Inter,sans-serif; background:var(--primary-soft); color:var(--primary); }
  .cats button.on { background:var(--primary); color:#fff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { position:relative; border:1.5px solid var(--border); border-radius:13px; background:#fff; padding:12px 12px 10px; min-height:92px; cursor:pointer; display:flex; flex-direction:column; user-select:none; text-align:left; }
  .tile .tn { font:600 14px/1.3 Inter,sans-serif; padding-right:22px; overflow-wrap:break-word; }
  .tile .tp { color:var(--muted); font:600 13px Inter,sans-serif; margin-top:auto; padding-top:8px; padding-right:78px; }
  .tile.sel { border-color:var(--primary); background:var(--primary-soft); }
  .tile .qn { position:absolute; top:-8px; right:-6px; background:var(--primary); color:#fff; min-width:25px; height:25px; border-radius:99px; display:grid; place-items:center; font:800 13px Inter,sans-serif; padding:0 7px; box-shadow:0 2px 6px rgba(16,24,40,.25); }
  .tstep { position:absolute; bottom:8px; right:8px; display:flex; gap:6px; }
  .tstep button { width:33px; height:33px; border-radius:99px; border:1px solid var(--border); background:#fff; color:var(--text); font:700 18px/1 Inter,sans-serif; display:grid; place-items:center; cursor:pointer; padding:0; margin:0; }
  .tstep .ad { background:var(--primary); border-color:var(--primary); color:#fff; }
  .cartbar { position:fixed; left:0; right:0; bottom:52px; z-index:30; background:#fff; border-top:1px solid var(--border); padding:10px 16px; box-shadow:0 -4px 16px rgba(16,24,40,.07); }
  .cartbar-in { max-width:420px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .cinfo { flex:1; min-width:0; }
  .cn { color:var(--muted); font:600 12.5px Inter,sans-serif; }
  .ct { font:800 19px Inter,sans-serif; letter-spacing:-.01em; }

  /* Número y estado del pedido */
  .bignum { font:900 72px/1.05 Inter,sans-serif; letter-spacing:-.03em; color:var(--primary); margin:6px 0 10px; font-variant-numeric:tabular-nums; }
  .statuschip { display:inline-block; padding:7px 16px; border-radius:99px; font:700 13.5px Inter,sans-serif; background:var(--primary-soft); color:var(--primary); }
  .sent-ready .bignum { color:var(--ok); }
  .sent-ready .statuschip { background:var(--ok-soft); color:#027a48; animation:pulse 1s ease infinite alternate; }
  @keyframes pulse { from { transform:scale(1); } to { transform:scale(1.06); } }

  /* Listas (gastos / invitaciones) */
  .row { display:flex; align-items:center; flex-wrap:wrap; gap:10px 12px; padding:12px 0; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:0; }
  .avatar { width:38px; height:38px; border-radius:99px; background:var(--primary-soft); color:var(--primary); font:700 13px Inter,sans-serif; display:grid; place-items:center; flex-shrink:0; }
  .who { flex:1 1 120px; min-width:0; }
  .who b { display:block; font-size:14.5px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .who small { color:var(--muted); font-size:12.5px; }
  .money { font-weight:700; font-size:14.5px; white-space:nowrap; }
  .chip { padding:3px 10px; border-radius:99px; font:600 12px Inter,sans-serif; white-space:nowrap; }
  .c-ok { background:var(--ok-soft); color:#027a48; }
  .c-mut { background:var(--gray-soft); color:var(--muted); }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; }
  .kpi .l { color:var(--muted); font:600 12px Inter,sans-serif; margin-bottom:5px; }
  .kpi .v { font-size:clamp(17px, 5.5vw, 21px); font-weight:800; letter-spacing:-.02em; white-space:nowrap; }
  .detail { background:var(--gray-soft); border-radius:10px; padding:4px 12px; margin:6px 0 2px; width:100%; }
  .detail .row { padding:9px 0; }

  /* Tipo de invitado (2 botones grandes) */
  .typegrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .typebtn { border:1.5px solid var(--border); border-radius:13px; background:#fff; padding:13px 12px; cursor:pointer; text-align:left; font-family:Inter,sans-serif; }
  .typebtn b { display:block; font-size:14px; letter-spacing:-.01em; }
  .typebtn small { color:var(--muted); font-size:12px; line-height:1.4; display:block; margin-top:3px; }
  .typebtn.on { border-color:var(--primary); background:var(--primary-soft); }

  .share { background:var(--gray-soft); border-radius:9px; padding:10px 12px; font-size:12px; color:var(--muted); word-break:break-all; margin-top:12px; }
  dialog { background:var(--surface); color:var(--text); border:0; border-radius:16px; padding:22px; max-width:400px; width:calc(100% - 40px); box-shadow:0 20px 50px rgba(16,24,40,.25); }
  dialog::backdrop { background:rgba(16,24,40,.45); }
  dialog h2 { font-size:17px; margin-bottom:4px; }
  .btn-block { display:block; width:100%; text-align:center; text-decoration:none; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">micaseta<i>.</i></div>
  <div id="dead" class="dead hidden"></div>
  <div id="app" class="hidden">

    <!-- ══ MI QR ══ -->
    <section id="v-qr">
      <div class="head">
        <div class="k" id="hRole"></div>
        <h1 id="hName"></h1>
        <div class="sub" id="hCaseta"></div>
      </div>
      <div id="accessWarn" class="warn hidden"></div>
      <div class="card center">
        <p class="mut" style="margin-bottom:12px" id="qrHint">Tu código para entrar y pedir. Preséntalo en la puerta.</p>
        <div class="qrframe"><img id="qrImg" alt="Tu código QR"></div>
        <p class="mut" id="qrSub" style="margin-top:12px"></p>
      </div>
      <button class="btn btn-primary" id="goPedir">Pedir desde el móvil</button>
    </section>

    <!-- ══ PEDIR ══ -->
    <section id="v-pedir" class="hidden">
      <div class="card" style="padding:16px">
        <h3 style="font-size:16px">Haz tu pedido</h3>
        <p class="mut" id="menuSub"></p>
        <div class="cats" id="cats"></div>
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <!-- pedido enviado -->
    <section id="v-sent" class="hidden">
      <div class="card center">
        <p class="mut" style="font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px">Tu número</p>
        <div class="bignum" id="sentNum"></div>
        <div class="statuschip" id="sentStatus"></div>
        <h3 id="sentTitle" style="font-size:16px;margin-top:14px"></h3>
        <p class="mut" id="sentSub" style="margin-top:6px"></p>
        <button class="btn btn-sec" id="sentBack" style="margin-top:14px">Volver</button>
      </div>
    </section>

    <!-- ══ GASTOS ══ -->
    <section id="v-gastos" class="hidden"></section>

    <!-- ══ INVITAR ══ -->
    <section id="v-invitar" class="hidden">
      <div class="card">
        <h3 style="font-size:16px">Invitar a alguien</h3>
        <label>Nombre de tu invitado</label><input id="i_name" placeholder="Ana López">
        <label>Su móvil <span style="color:#98a2b3">(opcional)</span></label><input id="i_phone" placeholder="698 765 432" inputmode="tel">
        <label>Tipo de invitación</label>
        <div class="typegrid">
          <button type="button" class="typebtn on" id="t_barra"><b>🍺 Con barra</b><small>Puede pedir a tu cuenta</small></button>
          <button type="button" class="typebtn" id="t_entrada"><b>🎟️ Solo entrada</b><small>Su QR abre la puerta, sin consumo</small></button>
        </div>
        <div class="grid2" id="limitRow">
          <div><label>Límite € <span style="color:#98a2b3">(vacío = sin límite)</span></label><input id="i_limit" placeholder="50" inputmode="decimal"></div>
          <div><label>Solo un día <span style="color:#98a2b3">(vacío = siempre)</span></label><input id="i_date" type="date"></div>
        </div>
        <button class="btn btn-primary" id="i_crear">Crear invitación</button>
        <div class="err" id="i_err"></div>
      </div>
      <h3 style="font-size:14px;margin:18px 0 8px;color:#344054">Mis invitaciones</h3>
      <div class="card" id="i_list"></div>
    </section>

  </div>
</div>

<!-- carrito fijo (solo en Pedir) -->
<div class="cartbar hidden" id="cartbar">
  <div class="cartbar-in">
    <div class="cinfo"><div class="cn" id="cartN"></div><div class="ct" id="cartT"></div></div>
    <button class="btn btn-primary" id="sendOrder" style="width:auto;margin:0;padding:13px 20px">Enviar pedido</button>
  </div>
  <div class="err" id="cartErr" style="max-width:420px;margin:0 auto"></div>
</div>

<nav id="nav" class="hidden"><div class="nav-in">
  <button data-v="qr" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14h1M14 20h1M20 20h1"/></svg>Mi QR</button>
  <button data-v="pedir" id="nb-pedir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14l-1.5 9a5.5 5.5 0 0 1-11 0L5 3z"/><path d="M12 17v4M8 21h8"/></svg>Pedir</button>
  <button data-v="gastos" id="nb-gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Gastos</button>
  <button data-v="invitar" id="nb-invitar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Invitar</button>
</div></nav>
<dialog id="dlg"></dialog>

<script>
const $ = (id) => document.getElementById(id);
const t = new URLSearchParams(location.search).get('t') ?? '';
const eur = (c) => (c/100).toLocaleString('es-ES', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const initials = (n) => (n ?? '?').trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() ?? '').join('') || '?';
const CAT_LABELS = { cerveza:'Cervezas', vino:'Vinos', refresco:'Refrescos', copa:'Copas', botella:'Botellas', comida:'Comida', general:'Otros' };
let me = null, qty = {}, cat = null, view = 'qr', invType = 'barra';

async function api(path, opts) {
  const r = await fetch(path, opts ? { headers:{'Content-Type':'application/json'}, ...opts } : undefined);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
}

// ---- Navegación ----
function show(v) {
  view = v;
  for (const s of ['qr','pedir','gastos','invitar']) $('v-' + s).classList.toggle('hidden', s !== v);
  $('v-sent').classList.add('hidden');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('cartbar').classList.toggle('hidden', v !== 'pedir');
  if (v === 'pedir') { renderCats(); renderGrid(); updateCart(); }
  if (v === 'gastos') renderGastos();
  if (v === 'invitar') renderInvitaciones();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.v));
$('goPedir').onclick = () => show('pedir');

// ---- Carga ----
async function load() {
  let data;
  try { data = await api('/gapi/mi?t=' + encodeURIComponent(t)); }
  catch (e) { $('dead').textContent = e.message || 'Este enlace no es válido.'; $('dead').classList.remove('hidden'); return; }
  me = data;
  const ORDER = ['cerveza','vino','refresco','copa','botella','comida'];
  me.products.sort((a, b) => (ORDER.indexOf(a.category) - ORDER.indexOf(b.category)) || a.name.localeCompare(b.name));

  const esSocio = me.role === 'socio';
  $('hRole').textContent = esSocio ? 'Socio' : 'Invitado' + (me.hostName ? ' · invita ' + me.hostName : '');
  $('hName').textContent = me.name ?? '';
  $('hCaseta').textContent = me.caseta;
  $('qrImg').src = '/qr.png?t=' + encodeURIComponent(me.qrToken);

  if (esSocio) {
    const pend = me.gastos.people.reduce((a, p) => a + p.pending_cents, 0);
    $('qrSub').textContent = pend > 0 ? `Cuenta pendiente: ${eur(pend)}` : 'No tienes consumo pendiente.';
  } else if (!me.canOrder) {
    $('qrHint').textContent = 'Tu invitación es solo de entrada. Presenta este código en la puerta.';
    $('qrSub').textContent = '';
  } else {
    $('qrSub').textContent = me.remainingCents === null
      ? 'Consumo sin límite, a cuenta de ' + (me.hostName ?? 'tu socio')
      : `Te quedan ${eur(me.remainingCents)} de ${eur(me.spendLimitCents)}`;
  }
  if (!me.accessOk) { $('accessWarn').textContent = '⚠️ ' + me.accessReason; $('accessWarn').classList.remove('hidden'); }

  // Pestañas según quién eres
  $('nb-pedir').classList.toggle('hidden', !me.canOrder);
  $('goPedir').classList.toggle('hidden', !me.canOrder);
  $('nb-gastos').classList.toggle('hidden', !(esSocio || (me.role === 'invitado' && me.canOrder)));
  $('nb-invitar').classList.toggle('hidden', !esSocio);
  const tabs = 1 + (me.canOrder ? 1 : 0) + ((esSocio || me.canOrder) ? 1 : 0) + (esSocio ? 1 : 0);
  $('nav').classList.toggle('hidden', tabs < 2);
  $('menuSub').textContent = esSocio
    ? 'A tu cuenta de socio'
    : `A cuenta de ${me.hostName ?? 'tu socio'}` + (me.remainingCents !== null ? ` · te quedan ${eur(me.remainingCents)}` : '');
  $('app').classList.remove('hidden');
}

// ---- Pedir ----
function renderCats() {
  const cats = [...new Set(me.products.map(p => p.category))];
  if (!cats.includes(cat)) cat = cats[0] ?? null;
  const box = $('cats'); box.innerHTML = '';
  for (const c of cats) {
    const b = document.createElement('button');
    b.textContent = CAT_LABELS[c] ?? c;
    if (c === cat) b.classList.add('on');
    b.onclick = () => { cat = c; renderCats(); renderGrid(); };
    box.appendChild(b);
  }
}
function renderGrid() {
  const box = $('grid'); box.innerHTML = '';
  for (const p of me.products.filter(x => x.category === cat)) {
    const n = qty[p.id] || 0;
    const tile = document.createElement('div');
    tile.className = 'tile' + (n ? ' sel' : '');
    tile.innerHTML = `<span class="tn">${esc(p.name)}</span><span class="tp">${eur(p.price_cents)}</span>
      ${n ? `<span class="qn">${n}</span><div class="tstep"><button class="rm">−</button><button class="ad">＋</button></div>` : ''}`;
    const add = () => { qty[p.id] = (qty[p.id] || 0) + 1; renderGrid(); updateCart(); };
    tile.onclick = (ev) => { if (ev.target.closest('.tstep')) return; add(); };
    const rm = tile.querySelector('.rm');
    if (rm) rm.onclick = (ev) => { ev.stopPropagation(); qty[p.id] = Math.max(0, (qty[p.id] || 0) - 1); renderGrid(); updateCart(); };
    const ad = tile.querySelector('.ad');
    if (ad) ad.onclick = (ev) => { ev.stopPropagation(); add(); };
    box.appendChild(tile);
  }
}
function updateCart() {
  const n = Object.values(qty).reduce((a, b) => a + b, 0);
  let total = 0;
  for (const p of me.products) total += (qty[p.id] || 0) * p.price_cents;
  $('cartN').textContent = n === 0 ? 'Toca productos para añadirlos' : `${n} artículo${n === 1 ? '' : 's'}`;
  $('cartT').textContent = eur(total);
  $('sendOrder').disabled = n === 0;
  $('sendOrder').style.opacity = n === 0 ? '.45' : '1';
}
$('sendOrder').onclick = async () => {
  const items = Object.entries(qty).filter(([, q]) => q > 0).map(([productId, q]) => ({ productId: Number(productId), qty: q }));
  if (!items.length) return;
  $('sendOrder').disabled = true; $('cartErr').textContent = '';
  let data;
  try {
    data = await api('/gapi/mi/pedido', { method:'POST', body: JSON.stringify({ t, items }) });
  } catch (e) { $('cartErr').textContent = e.message; $('sendOrder').disabled = false; return; }
  qty = {};
  $('v-pedir').classList.add('hidden'); $('cartbar').classList.add('hidden');
  $('v-sent').classList.remove('hidden');
  $('sentTitle').textContent = `Pedido enviado · ${eur(data.totalCents)}`;
  $('sendOrder').disabled = false;
  trackOrder(data.orderId, data.pickupNumber);
};

let trackTimer = null;
function setSentState(status) {
  $('v-sent').classList.toggle('sent-ready', status === 'lista');
  if (status === 'lista') {
    $('sentStatus').textContent = '¡Listo! Recógelo en la barra';
    $('sentSub').textContent = 'Tu número está en la pantalla de la caseta.';
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } else if (status === 'servida') {
    $('sentStatus').textContent = 'Entregado · ¡que aproveche!';
    $('sentSub').textContent = me.role === 'socio' ? 'Cargado a tu cuenta de socio.' : `Cargado a la cuenta de ${me.hostName ?? 'tu socio'}.`;
  } else {
    $('sentStatus').textContent = 'En preparación…';
    $('sentSub').textContent = 'Cuando esté listo, tu número saldrá en la pantalla de la caseta y te avisaremos aquí.';
  }
}
function trackOrder(orderId, pickupNumber) {
  $('sentNum').textContent = pickupNumber ?? '—';
  setSentState('pendiente');
  clearInterval(trackTimer);
  trackTimer = setInterval(async () => {
    if ($('v-sent').classList.contains('hidden')) { clearInterval(trackTimer); return; }
    try {
      const st = await api(`/gapi/mi/pedido-estado?t=${encodeURIComponent(t)}&id=${orderId}`);
      setSentState(st.status);
      if (st.status === 'servida') clearInterval(trackTimer);
    } catch { /* reintenta */ }
  }, 5000);
}
$('sentBack').onclick = async () => { clearInterval(trackTimer); await load(); show('qr'); };

// ---- Gastos ----
function renderGastos() {
  const box = $('v-gastos');
  if (me.role !== 'socio') {
    box.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="l">Has consumido</div><div class="v">${eur(me.spentCents)}</div></div>
      <div class="kpi"><div class="l">Te queda</div><div class="v">${me.remainingCents === null ? 'Sin límite' : eur(me.remainingCents)}</div></div>
    </div>
    <div class="card"><p class="mut">Todo va a la cuenta de ${esc(me.hostName ?? 'tu socio')}: tú no pagas nada en la caseta.</p></div>`;
    return;
  }
  const pend = me.gastos.people.reduce((a, p) => a + p.pending_cents, 0);
  const total = me.gastos.people.reduce((a, p) => a + p.total_cents, 0);
  box.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="l">Pendiente de pagar</div><div class="v">${eur(pend)}</div></div>
      <div class="kpi"><div class="l">Total histórico</div><div class="v">${eur(total)}</div></div>
    </div>
    <div class="card" id="g_list">${me.gastos.people.length ? '' : '<p class="mut">Aún no hay consumo. Cuando tú o tus invitados pidáis, saldrá aquí.</p>'}</div>`;
  const list = $('g_list');
  for (const p of me.gastos.people) {
    const row = document.createElement('div'); row.className = 'row';
    row.style.cursor = 'pointer';
    row.innerHTML = `<div class="avatar">${initials(p.customer_name)}</div>
      <div class="who"><b>${esc(p.customer_name ?? '')}${p.es_socio ? ' (tú)' : ''}</b><small>${p.n_orders} comanda${p.n_orders === 1 ? '' : 's'}</small></div>
      <span class="money">${eur(p.pending_cents)}</span>`;
    let open = null;
    row.onclick = () => {
      if (open) { open.remove(); open = null; return; }
      open = document.createElement('div'); open.className = 'detail';
      const det = me.gastos.detail.filter(d => d.customer_id === p.customer_id);
      open.innerHTML = det.map(d => `<div class="row">
          <div class="who"><b style="font-size:13px">${esc(d.items ?? 'Comanda')}</b>
          <small>${new Date(d.created_at).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small></div>
          <span class="chip ${d.settled ? 'c-ok' : 'c-mut'}">${d.settled ? 'pagada' : 'pendiente'}</span>
          <span class="money">${eur(d.total_cents)}</span></div>`).join('') || '<p class="mut" style="padding:8px 0">Sin comandas.</p>';
      row.after(open);
    };
    list.appendChild(row);
  }
}

// ---- Invitar ----
$('t_barra').onclick = () => { invType = 'barra'; $('t_barra').classList.add('on'); $('t_entrada').classList.remove('on'); $('limitRow').style.display = ''; };
$('t_entrada').onclick = () => { invType = 'entrada'; $('t_entrada').classList.add('on'); $('t_barra').classList.remove('on'); $('limitRow').style.display = 'none'; };

const waShare = (text, phone) =>
  (phone ? `https://wa.me/${String(phone).replace(/\D/g,'')}` : 'https://wa.me/') + `?text=${encodeURIComponent(text)}`;
function shareDlg(title, text, phone, url) {
  $('dlg').innerHTML = `<h2>${esc(title)}</h2><p class="mut">Envíasela: se registra con su selfie y recibe su QR al momento.</p>
    <a class="btn btn-primary btn-block" style="color:#fff" href="${waShare(text, phone)}" target="_blank">Enviar por WhatsApp</a>
    <button class="btn btn-sec btn-block" id="cpBtn">Copiar enlace</button>
    <div class="share">${esc(url)}</div>
    <button class="btn btn-sec btn-block" onclick="document.getElementById('dlg').close()">Cerrar</button>`;
  $('cpBtn').onclick = () => { navigator.clipboard.writeText(url); $('cpBtn').textContent = 'Copiado'; };
  $('dlg').showModal();
}

$('i_crear').onclick = async () => {
  $('i_err').textContent = '';
  let r;
  try {
    r = await api('/gapi/mi/invitar', { method:'POST', body: JSON.stringify({
      t, guestName: $('i_name').value, guestPhone: $('i_phone').value || null,
      type: invType, limit: $('i_limit').value || null, date: $('i_date').value || null,
    }) });
  } catch (e) { $('i_err').textContent = e.message; return; }
  $('i_name').value = ''; $('i_phone').value = ''; $('i_limit').value = ''; $('i_date').value = '';
  await load();
  renderInvitaciones();
  shareDlg('Invitación creada', r.shareText, r.guestPhone, r.shareUrl);
};

function renderInvitaciones() {
  const box = $('i_list');
  const invs = me.invitaciones ?? [];
  box.innerHTML = invs.length ? '' : '<p class="mut">Todavía no has invitado a nadie.</p>';
  for (const i of invs) {
    const row = document.createElement('div'); row.className = 'row';
    const tipo = i.canOrder ? (i.spendLimitCents === null ? 'con barra · sin límite' : 'con barra · hasta ' + eur(i.spendLimitCents)) : 'solo entrada';
    row.innerHTML = `<div class="avatar">${initials(i.guestName)}</div>
      <div class="who"><b>${esc(i.guestName ?? 'Invitado')}</b><small>${tipo}${i.validDate ? ' · ' + i.validDate : ''}</small></div>
      <span class="chip ${i.status === 'aceptada' ? 'c-ok' : 'c-mut'}">${i.status}</span>
      <button class="btn btn-sec btn-mini">Compartir</button>
      <button class="btn btn-sec btn-mini">✕</button>`;
    const [shareBtn, cancelBtn] = row.querySelectorAll('button');
    shareBtn.onclick = () => shareDlg('Compartir invitación', i.shareText, null, i.shareUrl);
    cancelBtn.onclick = async () => {
      if (!confirm('¿Cancelar esta invitación? Su QR dejará de funcionar.')) return;
      await api(`/gapi/mi/invitaciones/${i.id}/cancelar`, { method:'POST', body: JSON.stringify({ t }) });
      await load(); renderInvitaciones();
    };
    box.appendChild(row);
  }
}

load();
</script>
</body>
