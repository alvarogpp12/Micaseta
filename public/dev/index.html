<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micaseta · Simulador WhatsApp</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,sans-serif; background:#0b141a; color:#e9edef; display:flex; flex-direction:column; height:100vh; }
  header { background:#202c33; padding:12px 16px; display:flex; gap:10px; align-items:center; }
  header input { flex:1; padding:9px 12px; border-radius:8px; border:0; background:#2a3942; color:#e9edef; font-size:15px; }
  header button { padding:9px 14px; border-radius:8px; border:0; background:#00a884; color:#fff; font-weight:700; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:6px;
          background:#0b141a url('data:image/svg+xml,%3Csvg width="60" height="60" xmlns="http://www.w3.org/2000/svg"%3E%3Ccircle cx="30" cy="30" r="1" fill="%23182229"/%3E%3C/svg%3E'); }
  .msg { max-width:78%; padding:8px 12px; border-radius:10px; white-space:pre-wrap; font-size:14.5px; line-height:1.35; }
  .in  { align-self:flex-end; background:#005c4b; border-bottom-right-radius:2px; }
  .out { align-self:flex-start; background:#202c33; border-bottom-left-radius:2px; }
  .msg img { max-width:230px; border-radius:8px; display:block; margin-top:6px; }
  footer { background:#202c33; padding:10px 12px; display:flex; gap:8px; align-items:center; }
  footer input[type=text] { flex:1; padding:11px 14px; border-radius:22px; border:0; background:#2a3942; color:#e9edef; font-size:15px; }
  footer button, footer label { padding:10px 14px; border-radius:50%; border:0; background:#00a884; color:#fff; font-size:17px; cursor:pointer; }
  .hint { color:#8696a0; font-size:12.5px; text-align:center; padding:6px; }
</style>
</head>
<body>
<header>
  📱 <input id="phone" placeholder="Tu teléfono simulado (ej: 612345678)">
  <button id="connect">Abrir chat</button>
</header>
<div class="hint">Simulador de desarrollo: habla con el bot como si fuera WhatsApp. Cambia de número para probar cada rol.</div>
<div id="chat"></div>
<footer>
  <label for="file">📎</label><input type="file" id="file" accept="image/*" style="display:none">
  <input type="text" id="text" placeholder="Escribe un mensaje">
  <button id="send">➤</button>
</footer>
<script>
const $ = (id) => document.getElementById(id);
let phone = null, timer = null, lastLen = -1;

$('connect').onclick = () => {
  phone = $('phone').value.trim();
  if (!phone) return alert('Pon un teléfono');
  localStorage.setItem('devPhone', phone);
  lastLen = -1;
  if (timer) clearInterval(timer);
  timer = setInterval(poll, 1200);
  poll();
};

async function poll() {
  if (!phone) return;
  const r = await fetch('/dev/api/log?phone=' + encodeURIComponent(phone));
  const { log } = await r.json();
  if (log.length === lastLen) return;
  lastLen = log.length;
  const chat = $('chat'); chat.innerHTML = '';
  for (const e of log) {
    const div = document.createElement('div');
    div.className = 'msg ' + (e.dir === 'in' ? 'in' : 'out');
    if (e.text) div.textContent = e.text;
    if (e.caption) div.textContent = e.caption;
    if (e.imageBase64) {
      const img = document.createElement('img');
      img.src = 'data:image/png;base64,' + e.imageBase64;
      div.appendChild(img);
    }
    chat.appendChild(div);
  }
  chat.scrollTop = chat.scrollHeight;
}

async function send(text, imageBase64) {
  if (!phone) return alert('Primero abre un chat con tu teléfono');
  await fetch('/dev/api/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: phone, text, imageBase64 }),
  });
  poll();
}

$('send').onclick = () => { const t = $('text').value.trim(); if (t) { send(t); $('text').value = ''; } };
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('send').onclick(); });
$('file').addEventListener('change', () => {
  const f = $('file').files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => send('', reader.result.split(',')[1]);
  reader.readAsDataURL(f);
  $('file').value = '';
});

const saved = localStorage.getItem('devPhone');
if (saved) { $('phone').value = saved; $('connect').onclick(); }
</script>
</body>
</html>
