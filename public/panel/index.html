<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Panel — Micaseta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f6fa; --surface:#ffffff; --border:#e6e8f0; --text:#101828; --muted:#667085;
    --primary:#4353ff; --primary-dark:#3543d9; --primary-soft:#eef0ff;
    --ok:#12b76a; --ok-soft:#e7f8f0; --danger:#f04438; --danger-soft:#feeceb; --gray-soft:#f2f4f7;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; touch-action:manipulation; overflow-x:hidden; padding-bottom:86px; }
  .topbar { background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; }
  .topbar-in { max-width:640px; margin:0 auto; padding:13px 18px; display:flex; justify-content:space-between; align-items:center; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .wordmark { font-weight:800; font-size:16px; letter-spacing:-.03em; white-space:nowrap; }
  .wordmark i { color:var(--primary); font-style:normal; }
  .casetaname { color:var(--muted); font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-left:1px solid var(--border); padding-left:10px; }
  .out { color:var(--muted); font:600 13px Inter,sans-serif; cursor:pointer; background:none; border:1px solid var(--border); border-radius:8px; padding:7px 12px; }
  main { max-width:640px; margin:0 auto; padding:18px 16px 0; }
  nav { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); z-index:20; }
  .nav-in { max-width:640px; margin:0 auto; display:flex; }
  nav button { flex:1; background:none; border:0; color:var(--muted); font:600 10.5px Inter,sans-serif; padding:9px 2px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  nav button svg { width:21px; height:21px; }
  nav button.on { color:var(--primary); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:15px 16px; }
  .kpi .l { color:var(--muted); font:600 12px Inter,sans-serif; margin-bottom:6px; }
  .kpi .v { font-size:clamp(17px, 5.5vw, 22px); font-weight:800; letter-spacing:-.02em; white-space:nowrap; }
  h2 { font-size:15px; font-weight:700; letter-spacing:-.01em; margin:20px 0 10px; }
  h2:first-child, .card h2:first-child { margin-top:0; }
  label { display:block; font:600 12.5px Inter,sans-serif; color:#344054; margin:12px 0 5px; }
  input, select { width:100%; padding:10px 12px; border-radius:9px; border:1px solid #d0d5dd; background:#fff; color:var(--text); font:400 16px Inter,sans-serif; outline:none; transition:border .15s, box-shadow .15s; }
  input:focus, select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(67,83,255,.12); }
  .btn { border:0; border-radius:9px; padding:11px 16px; font:600 14.5px Inter,sans-serif; cursor:pointer; transition:background .15s; }
  .btn-primary { background:var(--primary); color:#fff; width:100%; margin-top:14px; }
  .btn-primary:hover { background:var(--primary-dark); }
  .btn-sec { background:var(--surface); color:var(--text); border:1px solid var(--border); }
  .btn-mini { padding:7px 11px; font-size:13px; border-radius:8px; white-space:nowrap; }
  .btn-soft { background:var(--primary-soft); color:var(--primary); }
  .btn-ok { background:var(--ok); color:#fff; }
  .btn-block { display:block; width:100%; text-align:center; text-decoration:none; margin-top:10px; }
  .row { display:flex; align-items:center; flex-wrap:wrap; gap:10px 12px; padding:12px 0; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:0; }
  .avatar { width:38px; height:38px; border-radius:99px; background:var(--primary-soft); color:var(--primary); font:700 13px Inter,sans-serif; display:grid; place-items:center; flex-shrink:0; }
  .who { flex:1 1 150px; min-width:0; }
  .who b { display:block; font-size:14.5px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .who small { color:var(--muted); font-size:12.5px; }
  .chip { padding:3px 10px; border-radius:99px; font:600 12px Inter,sans-serif; white-space:nowrap; }
  .c-ok { background:var(--ok-soft); color:#027a48; }
  .c-bad { background:var(--danger-soft); color:#b42318; }
  .c-mut { background:var(--gray-soft); color:var(--muted); }
  .money { font-weight:700; font-size:14.5px; white-space:nowrap; }
  .err { color:var(--danger); font:600 13px Inter,sans-serif; margin-top:8px; min-height:16px; }
  .empty { color:var(--muted); font-size:14px; padding:6px 0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; } @media (max-width:360px) { .grid2 { grid-template-columns:1fr; } }
  .share { background:var(--gray-soft); border-radius:9px; padding:10px 12px; font-size:12px; color:var(--muted); word-break:break-all; margin-top:12px; }
  dialog { background:var(--surface); color:var(--text); border:0; border-radius:16px; padding:22px; max-width:400px; width:calc(100% - 40px); box-shadow:0 20px 50px rgba(16,24,40,.25); }
  dialog::backdrop { background:rgba(16,24,40,.45); }
  dialog h2 { margin-top:0; font-size:17px; }
  dialog .mut { color:var(--muted); font-size:13.5px; line-height:1.5; margin:6px 0 12px; }
  .qrframe { background:#fff; border:1px solid var(--border); border-radius:12px; padding:10px; }
  .qrframe img { width:100%; display:block; }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand"><span class="wordmark">micaseta<i>.</i></span><span class="casetaname" id="casetaName"></span></div>
  <button class="out" id="logout">Salir</button>
</div></div>
<main id="main"></main>
<nav><div class="nav-in">
  <button data-tab="resumen" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 13l4-4 4 4 5-6"/></svg>Resumen</button>
  <button data-tab="socios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Socios</button>
  <button data-tab="invitaciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M15 5v14M3 10h12"/></svg>Invitar</button>
  <button data-tab="staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h4M15 12h4M5.5 16.5c.5-1.5 2-2.5 3.5-2.5s3 1 3.5 2.5"/></svg>Equipo</button>
  <button data-tab="pantalla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Pantalla</button>
</div></nav>
<dialog id="dlg"></dialog>
<script>
const $ = (s) => document.querySelector(s);
const eur = (c) => (c/100).toLocaleString('es-ES', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const initials = (n) => (n ?? '?').trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() ?? '').join('') || '?';
let me = null, tab = 'resumen';

async function api(path, opts={}) {
  const r = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
  if (r.status === 401) { location.href = '/'; throw new Error('sesión'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
}
const post = (p, b) => api(p, { method:'POST', body: JSON.stringify(b ?? {}) });

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); tab = b.dataset.tab; render();
});
$('#logout').onclick = async () => { await post('/papi/logout'); location.href = '/'; };

function dlg(html) { $('#dlg').innerHTML = html + '<button class="btn btn-sec btn-block" onclick="document.getElementById(\'dlg\').close()">Cerrar</button>'; $('#dlg').showModal(); }
function waShare(text, phone) {
  const base = phone ? `https://wa.me/${String(phone).replace(/\D/g,'')}` : 'https://wa.me/';
  return `${base}?text=${encodeURIComponent(text)}`;
}
const shareBlock = (text, phone, url) => `
  <a class="btn btn-primary btn-block" style="color:#fff" href="${waShare(text, phone)}" target="_blank">Enviar por WhatsApp</a>
  <button class="btn btn-sec btn-block" onclick="navigator.clipboard.writeText(${JSON.stringify(url).replace(/"/g,'&quot;')});this.textContent='Copiado'">Copiar enlace</button>
  <div class="share">${esc(url)}</div>`;

async function render() {
  const m = $('#main');
  m.innerHTML = '<p class="empty" style="text-align:center;padding:26px">Cargando…</p>';
  try {
    if (tab === 'resumen') await renderResumen(m);
    if (tab === 'socios') await renderSocios(m);
    if (tab === 'invitaciones') await renderInvitaciones(m);
    if (tab === 'staff') await renderStaff(m);
    if (tab === 'pantalla') await renderPantalla(m);
  } catch (e) { m.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

// ---------- RESUMEN ----------
async function renderResumen(m) {
  const o = await api('/papi/overview');
  m.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="l">Consumo de hoy</div><div class="v">${eur(o.hoy.total)}</div></div>
      <div class="kpi"><div class="l">Entradas hoy</div><div class="v">${o.entradas}</div></div>
      <div class="kpi"><div class="l">Pendiente de liquidar</div><div class="v">${eur(o.pendienteCents)}</div></div>
      <div class="kpi"><div class="l">Socios · Invitados</div><div class="v">${o.counts.socios} · ${o.counts.invitados}</div></div>
    </div>
    <h2>Cuentas por socio</h2>
    <div class="card" id="cuentas">${o.cuentas.length ? '' : '<p class="empty">Aún no hay consumo registrado. Empieza dando de alta socios y creando invitaciones.</p>'}</div>`;
  const box = $('#cuentas');
  for (const c of o.cuentas) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="avatar">${initials(c.socio_name)}</div>
      <div class="who"><b>${esc(c.socio_name ?? 'Socio')}</b><small>${c.n_orders} comandas · total ${eur(c.total_cents)}</small></div>
      <span class="money">${eur(c.pending_cents)}</span>
      <button class="btn btn-mini btn-sec">Ver</button>
      ${c.pending_cents > 0 ? '<button class="btn btn-mini btn-ok">Liquidar</button>' : ''}`;
    const btns = row.querySelectorAll('button');
    btns[0].onclick = async () => {
      const det = await api(`/papi/cuentas/${c.socio_id}`);
      dlg(`<h2>Cuenta de ${esc(c.socio_name ?? '')}</h2>` + (det.length ? det.map(d =>
        `<div class="row"><div class="who"><b>${esc(d.customer_name ?? '')}${d.es_socio ? ' (socio)' : ''}</b><small>${new Date(d.created_at).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small></div><span class="chip ${d.settled ? 'c-ok' : 'c-mut'}">${d.settled ? 'liquidada' : 'pendiente'}</span><span class="money">${eur(d.total_cents)}</span></div>`).join('') : '<p class="empty">Sin comandas.</p>'));
    };
    if (btns[1]) btns[1].onclick = async () => {
      if (!confirm(`¿Marcar como pagada la cuenta de ${c.socio_name} (${eur(c.pending_cents)})?`)) return;
      await post(`/papi/cuentas/${c.socio_id}/liquidar`); render();
    };
    box.appendChild(row);
  }
}

// ---------- SOCIOS ----------
async function renderSocios(m) {
  const socios = await api('/papi/socios');
  m.innerHTML = `
    <div class="card">
      <h2>Nuevo socio</h2>
      <div class="grid2"><div><label>Nombre</label><input id="s_name" placeholder="Juan Pérez"></div><div><label>Móvil</label><input id="s_phone" placeholder="612 345 678"></div></div>
      <button class="btn btn-primary" id="s_add">Dar de alta</button><div class="err" id="s_err"></div>
    </div>
    <h2>Socios · ${socios.length}</h2>
    <div class="card" id="s_list">${socios.length ? '' : '<p class="empty">Todavía no hay socios.</p>'}</div>`;
  $('#s_add').onclick = async () => {
    $('#s_err').textContent = '';
    try { await post('/papi/socios', { name:$('#s_name').value, phone:$('#s_phone').value }); render(); }
    catch (e) { $('#s_err').textContent = e.message; }
  };
  const box = $('#s_list');
  for (const s of socios) {
    const row = document.createElement('div'); row.className = 'row';
    const suspended = s.status === 'suspendido';
    row.innerHTML = `<div class="avatar">${initials(s.name)}</div>
      <div class="who"><b>${esc(s.name ?? '')}</b><small>+${s.phone}</small></div>
      <span class="chip ${suspended ? 'c-bad' : 'c-ok'}">${suspended ? 'suspendido' : 'activo'}</span>
      ${s.qrToken ? '<button class="btn btn-mini btn-soft">Su app</button>' : ''}
      <button class="btn btn-mini btn-sec">${suspended ? 'Activar' : 'Baja'}</button>`;
    const btns = row.querySelectorAll('button');
    const qrBtn = s.qrToken ? btns[0] : null;
    const susBtn = btns[btns.length - 1];
    if (qrBtn) qrBtn.onclick = () => {
      const socioUrl = location.origin + '/mi/?t=' + encodeURIComponent(s.qrToken);
      dlg(`<h2>App de ${esc(s.name ?? '')}</h2><p class="mut">Su app personal: QR, pedir desde el móvil, sus gastos y crear sus invitaciones. Envíasela por WhatsApp una sola vez.</p>
      <div class="qrframe"><img src="/qr.png?t=${encodeURIComponent(s.qrToken)}" alt="QR del socio"></div>
      <a class="btn btn-sec btn-block" href="${socioUrl}" target="_blank">Abrir su página (probar)</a>` +
      shareBlock('Tu acceso de socio a la caseta. Dentro tienes tu QR y puedes pedir desde el móvil: ' + socioUrl, s.phone, socioUrl));
    };
    susBtn.onclick = async () => { await post(`/papi/socios/${s.id}/suspender`); render(); };
    box.appendChild(row);
  }
}

// ---------- INVITACIONES (supervisión: las crean los socios desde su app) ----------
async function renderInvitaciones(m) {
  const invs = await api('/papi/invitations');
  m.innerHTML = `
    <div class="card">
      <h2>Invitaciones de la caseta</h2>
      <p class="empty" style="padding:4px 0 0">Cada socio invita desde su propia app (pestaña Socios → "Su app"). Aquí las ves todas y puedes cancelar cualquiera.</p>
    </div>
    <h2>Invitaciones · ${invs.length}</h2>
    <div class="card" id="i_list">${invs.length ? '' : '<p class="empty">Ninguna todavía.</p>'}</div>`;
  const box = $('#i_list');
  for (const i of invs) {
    const row = document.createElement('div'); row.className = 'row';
    const st = { pendiente:'c-mut', aceptada:'c-ok', cancelada:'c-bad', rechazada:'c-bad' }[i.status] ?? 'c-mut';
    const gname = i.guest_name ?? i.guest_label ?? (i.guest_phone ? '+'+i.guest_phone : 'Invitado');
    const tipo = i.can_order === false ? 'solo entrada' : 'con barra';
    row.innerHTML = `<div class="avatar">${initials(gname)}</div>
      <div class="who"><b>${esc(gname)}</b><small>invita ${esc(i.socio_name ?? '')} · ${tipo}</small></div>
      <span class="chip ${st}">${i.status}</span>
      <button class="btn btn-mini btn-soft">Compartir</button>
      ${['pendiente','aceptada'].includes(i.status) ? '<button class="btn btn-mini btn-sec">Cancelar</button>' : ''}`;
    const [shareBtn, cancelBtn] = row.querySelectorAll('button');
    shareBtn.onclick = () => dlg(`<h2>Compartir invitación</h2>` + shareBlock(i.shareText, i.guest_phone, i.shareUrl));
    if (cancelBtn) cancelBtn.onclick = async () => {
      if (!confirm('¿Cancelar esta invitación? Su QR dejará de funcionar al instante.')) return;
      await post(`/papi/invitations/${i.id}/cancelar`); render();
    };
    box.appendChild(row);
  }
}

// ---------- PANTALLA (TV de la caseta) ----------
async function renderPantalla(m) {
  const r = await api('/papi/tv-link');
  m.innerHTML = `
    <div class="card">
      <h2>Pantalla de pedidos</h2>
      <p class="empty" style="padding:4px 0 0">Para la tele o una tablet de la caseta. Muestra los números de los pedidos hechos desde el móvil: primero "en preparación" y, cuando el camarero los marca listos, pasan a "listos para recoger". Se actualiza sola.</p>
      <a class="btn btn-primary btn-block" style="color:#fff;text-decoration:none" href="${r.url}" target="_blank">Abrir pantalla</a>
      <button class="btn btn-sec btn-block" id="tvCopy">Copiar enlace</button>
      <div class="share">${esc(r.url)}</div>
    </div>
    <div class="card">
      <h2>¿Cómo pide la gente desde el móvil?</h2>
      <p class="empty" style="padding:4px 0 0">Cada socio tiene su página personal (botón "Su app" en la pestaña Socios): ahí está su QR y el botón "Pedir desde el móvil". Los invitados piden desde el enlace de su invitación. Al enviar el pedido reciben su número, y el camarero lo gestiona desde su propia interfaz.</p>
    </div>`;
  $('#tvCopy').onclick = () => { navigator.clipboard.writeText(r.url); $('#tvCopy').textContent = 'Copiado'; };
}

// ---------- EQUIPO ----------
async function renderStaff(m) {
  const staff = await api('/papi/staff');
  m.innerHTML = `
    <div class="card">
      <h2>Nuevo miembro del equipo</h2>
      <div class="grid2"><div><label>Nombre</label><input id="t_name" placeholder="Pepe Ruiz"></div><div><label>Móvil</label><input id="t_phone" placeholder="622 222 222"></div></div>
      <label>Puesto</label>
      <select id="t_role"><option value="mesero">Camarero — comandas</option><option value="puerta">Puerta — entradas</option></select>
      <button class="btn btn-primary" id="t_add">Dar de alta</button><div class="err" id="t_err"></div>
      <p class="empty" style="margin-top:10px">Recibirá un enlace que abre el escáner de QR en su móvil. No hay que instalar nada.</p>
    </div>
    <h2>Equipo · ${staff.length}</h2>
    <div class="card" id="t_list">${staff.length ? '' : '<p class="empty">Nadie todavía.</p>'}</div>`;
  $('#t_add').onclick = async () => {
    $('#t_err').textContent = '';
    try {
      const r = await post('/papi/staff', { name:$('#t_name').value, phone:$('#t_phone').value, role:$('#t_role').value });
      dlg(`<h2>Alta completada</h2><p class="mut">Envíale su acceso al escáner:</p>` + shareBlock('Tu acceso al escáner de la caseta: ' + r.loginUrl, $('#t_phone').value, r.loginUrl));
      render();
    } catch (e) { $('#t_err').textContent = e.message; }
  };
  const box = $('#t_list');
  for (const s of staff) {
    const row = document.createElement('div'); row.className = 'row';
    const suspended = s.status === 'suspendido';
    row.innerHTML = `<div class="avatar">${initials(s.name)}</div>
      <div class="who"><b>${esc(s.name ?? '')}</b><small>${s.role === 'puerta' ? 'Puerta' : 'Camarero'} · +${s.phone}</small></div>
      ${s.loginUrl ? '<button class="btn btn-mini btn-soft">Acceso</button>' : ''}
      <button class="btn btn-mini btn-sec">${suspended ? 'Activar' : 'Baja'}</button>`;
    const btns = row.querySelectorAll('button');
    if (s.loginUrl) btns[0].onclick = () => dlg(`<h2>Acceso de ${esc(s.name ?? '')}</h2>` + shareBlock('Tu acceso al escáner de la caseta: ' + s.loginUrl, s.phone, s.loginUrl));
    btns[btns.length-1].onclick = async () => { await post(`/papi/socios/${s.id}/suspender`); render(); };
    box.appendChild(row);
  }
}

// ---------- init ----------
(async () => {
  try { me = await api('/papi/me'); $('#casetaName').textContent = me.caseta; render(); }
  catch { /* redirigido a / */ }
})();
</script>
</body>
</html>
