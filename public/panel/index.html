<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micaseta · Panel</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --txt:#eef1f6; --mut:#8b93a3; --acc:#e0533d; --acc2:#f0a83d; --ok:#2ecc71; --bad:#e74c3c; --blue:#4f8cff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,sans-serif; min-height:100vh; padding-bottom:80px; }
  header { padding:16px 18px 10px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:19px; } header h1 span { color:var(--acc2); }
  header .out { color:var(--mut); font-size:13px; cursor:pointer; }
  main { max-width:560px; margin:0 auto; padding:0 14px; }
  nav { position:fixed; bottom:0; left:0; right:0; background:#161a21; border-top:1px solid #262b36; display:flex; z-index:10; }
  nav button { flex:1; background:none; border:0; color:var(--mut); font-size:11px; padding:9px 2px 10px; cursor:pointer; }
  nav button .ico { display:block; font-size:20px; margin-bottom:2px; }
  nav button.on { color:var(--acc2); }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:12px; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .kpi { background:var(--card); border-radius:14px; padding:14px; }
  .kpi .v { font-size:24px; font-weight:800; } .kpi .l { color:var(--mut); font-size:12.5px; margin-top:2px; }
  h2 { font-size:16px; margin:16px 0 10px; }
  label { display:block; color:var(--mut); font-size:13px; margin:10px 0 4px; }
  input, select { width:100%; padding:12px; border-radius:10px; border:1px solid #333a48; background:#12151b; color:var(--txt); font-size:15px; }
  .btn { width:100%; border:0; border-radius:10px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; background:var(--acc); color:#fff; margin-top:12px; }
  .btn.blue { background:var(--blue); } .btn.ok { background:var(--ok); color:#06290f; } .btn.ghost { background:#262b36; color:var(--txt); }
  .btn.mini { width:auto; padding:8px 12px; font-size:13px; margin:0; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid #262b36; }
  .row:last-child { border-bottom:0; }
  .row .who { min-width:0; } .row .who b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .who small { color:var(--mut); }
  .badge { padding:3px 9px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; }
  .b-ok { background:#173; color:#7f7; } .b-bad { background:#511; color:#f99; } .b-mut { background:#262b36; color:var(--mut); }
  .err { color:var(--bad); font-weight:600; font-size:14px; min-height:18px; margin-top:8px; }
  .okmsg { color:var(--ok); font-weight:600; font-size:14px; margin-top:8px; }
  .hidden { display:none; }
  .money { font-weight:800; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .share { background:#12151b; border:1px dashed #333a48; border-radius:10px; padding:10px; font-size:12.5px; color:var(--mut); word-break:break-all; margin-top:10px; }
  .mut { color:var(--mut); font-size:13.5px; }
  dialog { background:var(--card); color:var(--txt); border:0; border-radius:16px; padding:20px; max-width:420px; width:92%; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
</style>
</head>
<body>
<header>
  <h1>🎪 <span id="casetaName">…</span></h1>
  <span class="out" id="logout">salir</span>
</header>
<main id="main"></main>
<nav>
  <button data-tab="resumen" class="on"><span class="ico">📊</span>Resumen</button>
  <button data-tab="socios"><span class="ico">👥</span>Socios</button>
  <button data-tab="invitaciones"><span class="ico">🎟</span>Invitar</button>
  <button data-tab="carta"><span class="ico">🍾</span>Carta</button>
  <button data-tab="staff"><span class="ico">🧑‍🍳</span>Equipo</button>
</nav>
<dialog id="dlg"></dialog>
<script>
const $ = (s) => document.querySelector(s);
const eur = (c) => (c/100).toFixed(2).replace('.', ',') + '€';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
let me = null, tab = 'resumen';

async function api(path, opts={}) {
  const r = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
  if (r.status === 401) { location.href = '/'; throw new Error('sesión'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
}
const post = (p, b) => api(p, { method:'POST', body: JSON.stringify(b ?? {}) });

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); tab = b.dataset.tab; render();
});
$('#logout').onclick = async () => { await post('/papi/logout'); location.href = '/'; };

function dlg(html) { $('#dlg').innerHTML = html + '<button class="btn ghost" onclick="document.getElementById(\'dlg\').close()">Cerrar</button>'; $('#dlg').showModal(); }

function waShare(text, phone) {
  const base = phone ? `https://wa.me/${phone.replace(/\D/g,'')}` : 'https://wa.me/';
  return `${base}?text=${encodeURIComponent(text)}`;
}

async function render() {
  const m = $('#main');
  m.innerHTML = '<p class="mut" style="padding:20px;text-align:center">Cargando…</p>';
  try {
    if (tab === 'resumen') await renderResumen(m);
    if (tab === 'socios') await renderSocios(m);
    if (tab === 'invitaciones') await renderInvitaciones(m);
    if (tab === 'carta') await renderCarta(m);
    if (tab === 'staff') await renderStaff(m);
  } catch (e) { m.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

// ---------- RESUMEN ----------
async function renderResumen(m) {
  const o = await api('/papi/overview');
  m.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="v">${eur(o.hoy.total)}</div><div class="l">Consumo de hoy · ${o.hoy.n} comandas</div></div>
      <div class="kpi"><div class="v">${o.entradas}</div><div class="l">Entradas hoy</div></div>
      <div class="kpi"><div class="v">${eur(o.pendienteCents)}</div><div class="l">Pendiente de liquidar</div></div>
      <div class="kpi"><div class="v">${o.counts.socios} · ${o.counts.invitados}</div><div class="l">Socios · Invitados activos</div></div>
    </div>
    <h2>💶 Cuentas por socio</h2>
    <div class="card" id="cuentas">${o.cuentas.length ? '' : '<p class="mut">Aún no hay consumo. Da de alta socios y crea invitaciones 🎟</p>'}</div>`;
  const box = $('#cuentas');
  for (const c of o.cuentas) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="who"><b>${esc(c.socio_name ?? 'Socio')}</b><small>${c.n_orders} comandas · total ${eur(c.total_cents)}</small></div>
      <span class="money">${eur(c.pending_cents)}</span>
      <button class="btn mini ghost">Ver</button>
      ${c.pending_cents > 0 ? '<button class="btn mini ok">Liquidar</button>' : ''}`;
    const [verBtn, liqBtn] = row.querySelectorAll('button');
    verBtn.onclick = async () => {
      const det = await api(`/papi/cuentas/${c.socio_id}`);
      dlg(`<h2>Cuenta de ${esc(c.socio_name ?? '')}</h2>` + (det.length ? det.map(d =>
        `<div class="row"><div class="who"><b>${esc(d.customer_name ?? '')}${d.es_socio ? ' ⭐' : ''}</b><small>${new Date(d.created_at).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small></div><span>${d.settled ? '✅' : '🕓'} ${eur(d.total_cents)}</span></div>`).join('') : '<p class="mut">Sin comandas.</p>'));
    };
    if (liqBtn) liqBtn.onclick = async () => {
      if (!confirm(`¿Marcar como pagada la cuenta de ${c.socio_name} (${eur(c.pending_cents)})?`)) return;
      await post(`/papi/cuentas/${c.socio_id}/liquidar`); render();
    };
    box.appendChild(row);
  }
}

// ---------- SOCIOS ----------
async function renderSocios(m) {
  const socios = await api('/papi/socios');
  m.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">➕ Nuevo socio</h2>
      <div class="grid2"><input id="s_name" placeholder="Nombre"><input id="s_phone" placeholder="Móvil (612345678)"></div>
      <button class="btn" id="s_add">Dar de alta</button><div class="err" id="s_err"></div>
    </div>
    <h2>👥 Socios (${socios.length})</h2>
    <div class="card" id="s_list">${socios.length ? '' : '<p class="mut">Todavía no hay socios.</p>'}</div>`;
  $('#s_add').onclick = async () => {
    $('#s_err').textContent = '';
    try { await post('/papi/socios', { name:$('#s_name').value, phone:$('#s_phone').value }); render(); }
    catch (e) { $('#s_err').textContent = e.message; }
  };
  const box = $('#s_list');
  for (const s of socios) {
    const row = document.createElement('div'); row.className = 'row';
    const suspended = s.status === 'suspendido';
    row.innerHTML = `<div class="who"><b>${esc(s.name ?? '')}</b><small>+${s.phone}</small></div>
      <span class="badge ${suspended ? 'b-bad' : 'b-ok'}">${suspended ? 'suspendido' : 'activo'}</span>
      ${s.qrToken ? '<button class="btn mini blue">QR</button>' : ''}
      <button class="btn mini ghost">${suspended ? 'Activar' : 'Baja'}</button>`;
    const btns = row.querySelectorAll('button');
    const qrBtn = s.qrToken ? btns[0] : null;
    const susBtn = btns[btns.length - 1];
    if (qrBtn) qrBtn.onclick = () => dlg(`<h2>QR de ${esc(s.name ?? '')}</h2><p class="mut">Es su identificación para pedir en la caseta. Envíaselo.</p><img src="/qr.png?t=${encodeURIComponent(s.qrToken)}" style="width:100%;border-radius:12px;background:#fff;padding:8px"><a class="btn blue" style="display:block;text-align:center;text-decoration:none" href="${waShare('Tu QR de socio de la caseta 🎪 ' + location.origin + '/qr.png?t=' + s.qrToken, s.phone)}" target="_blank">Enviar por WhatsApp</a>`);
    susBtn.onclick = async () => { await post(`/papi/socios/${s.id}/suspender`); render(); };
    box.appendChild(row);
  }
}

// ---------- INVITACIONES ----------
async function renderInvitaciones(m) {
  const [socios, invs] = await Promise.all([api('/papi/socios'), api('/papi/invitations')]);
  m.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">🎟 Nueva invitación</h2>
      ${socios.length ? `
      <label>Socio que invita</label>
      <select id="i_socio">${socios.filter(s=>s.status==='activo').map(s => `<option value="${s.id}">${esc(s.name ?? s.phone)}</option>`).join('')}</select>
      <div class="grid2">
        <div><label>Nombre del invitado</label><input id="i_name" placeholder="Ana"></div>
        <div><label>Su móvil (opcional)</label><input id="i_phone" placeholder="698765432"></div>
      </div>
      <div class="grid2">
        <div><label>Solo un día (vacío = siempre)</label><input id="i_date" type="date"></div>
        <div><label>Límite € (vacío = sin límite)</label><input id="i_limit" placeholder="50"></div>
      </div>
      <label>Acompañantes que puede traer</label><input id="i_comp" type="number" min="0" max="10" value="0">
      <button class="btn" id="i_add">Crear y compartir</button><div class="err" id="i_err"></div>
      ` : '<p class="mut">Primero da de alta un socio en la pestaña 👥 Socios.</p>'}
    </div>
    <h2>Invitaciones (${invs.length})</h2>
    <div class="card" id="i_list">${invs.length ? '' : '<p class="mut">Ninguna todavía.</p>'}</div>`;
  if (socios.length) $('#i_add').onclick = async () => {
    $('#i_err').textContent = '';
    try {
      const r = await post('/papi/invitations', {
        socioId: $('#i_socio').value, guestName: $('#i_name').value, guestPhone: $('#i_phone').value,
        date: $('#i_date').value || null, limit: $('#i_limit').value || null, companions: $('#i_comp').value,
      });
      dlg(`<h2>✅ Invitación creada</h2><p class="mut">Compártela: el invitado se registra con su selfie y recibe su QR al momento.</p>
        <a class="btn blue" style="display:block;text-align:center;text-decoration:none" href="${waShare(r.shareText, r.guestPhone)}" target="_blank">📲 Enviar por WhatsApp</a>
        <button class="btn ghost" onclick="navigator.clipboard.writeText(${JSON.stringify(r.shareUrl).replace(/"/g,'&quot;')});this.textContent='¡Copiado!'">Copiar link</button>
        <div class="share">${esc(r.shareUrl)}</div>`);
      render();
    } catch (e) { $('#i_err').textContent = e.message; }
  };
  const box = $('#i_list');
  for (const i of invs) {
    const row = document.createElement('div'); row.className = 'row';
    const st = { pendiente:'b-mut', aceptada:'b-ok', cancelada:'b-bad', rechazada:'b-bad' }[i.status] ?? 'b-mut';
    row.innerHTML = `<div class="who"><b>${esc(i.guest_name ?? i.guest_label ?? (i.guest_phone ? '+'+i.guest_phone : 'Invitado'))}</b><small>de ${esc(i.socio_name ?? '')}</small></div>
      <span class="badge ${st}">${i.status}</span>
      <button class="btn mini blue">📲</button>
      ${['pendiente','aceptada'].includes(i.status) ? '<button class="btn mini ghost">✕</button>' : ''}`;
    const [shareBtn, cancelBtn] = row.querySelectorAll('button');
    shareBtn.onclick = () => dlg(`<h2>Compartir invitación</h2>
      <a class="btn blue" style="display:block;text-align:center;text-decoration:none" href="${waShare(i.shareText, i.guest_phone)}" target="_blank">📲 Enviar por WhatsApp</a>
      <button class="btn ghost" onclick="navigator.clipboard.writeText(${JSON.stringify(i.shareUrl).replace(/"/g,'&quot;')});this.textContent='¡Copiado!'">Copiar link</button>
      <div class="share">${esc(i.shareUrl)}</div>`);
    if (cancelBtn) cancelBtn.onclick = async () => {
      if (!confirm('¿Cancelar esta invitación? Su QR dejará de funcionar al instante.')) return;
      await post(`/papi/invitations/${i.id}/cancelar`); render();
    };
    box.appendChild(row);
  }
}

// ---------- CARTA ----------
async function renderCarta(m) {
  const prods = await api('/papi/products');
  m.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">➕ Producto</h2>
      <div class="grid2"><input id="p_name" placeholder="Rebujito"><input id="p_price" placeholder="Precio (12)"></div>
      <label>Categoría</label>
      <select id="p_cat"><option>bebida</option><option>copa</option><option>botella</option><option>comida</option><option>otro</option></select>
      <button class="btn" id="p_add">Añadir a la carta</button><div class="err" id="p_err"></div>
    </div>
    <h2>🍾 Carta (${prods.length})</h2>
    <div class="card" id="p_list">${prods.length ? '' : '<p class="mut">Carta vacía. Añade rebujito, copas, raciones…</p>'}</div>`;
  $('#p_add').onclick = async () => {
    $('#p_err').textContent = '';
    try { await post('/papi/products', { name:$('#p_name').value, price:$('#p_price').value, category:$('#p_cat').value }); render(); }
    catch (e) { $('#p_err').textContent = e.message; }
  };
  const box = $('#p_list');
  for (const p of prods) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="who"><b>${esc(p.name)}</b><small>${esc(p.category)}</small></div>
      <span class="money">${eur(p.price_cents)}</span><button class="btn mini ghost">✕</button>`;
    row.querySelector('button').onclick = async () => { await post(`/papi/products/${p.id}/desactivar`); render(); };
    box.appendChild(row);
  }
}

// ---------- EQUIPO ----------
async function renderStaff(m) {
  const staff = await api('/papi/staff');
  m.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">➕ Camarero o puerta</h2>
      <div class="grid2"><input id="t_name" placeholder="Nombre"><input id="t_phone" placeholder="Móvil"></div>
      <label>Puesto</label>
      <select id="t_role"><option value="mesero">Camarero (comandas)</option><option value="puerta">Puerta (entradas)</option></select>
      <button class="btn" id="t_add">Dar de alta</button><div class="err" id="t_err"></div>
      <p class="mut" style="margin-top:10px">Recibirán un link para abrir el escáner de QR en su móvil. Sin instalar nada.</p>
    </div>
    <h2>🧑‍🍳 Equipo (${staff.length})</h2>
    <div class="card" id="t_list">${staff.length ? '' : '<p class="mut">Nadie todavía.</p>'}</div>`;
  $('#t_add').onclick = async () => {
    $('#t_err').textContent = '';
    try {
      const r = await post('/papi/staff', { name:$('#t_name').value, phone:$('#t_phone').value, role:$('#t_role').value });
      dlg(`<h2>✅ Alta hecha</h2><p class="mut">Envíale su acceso al escáner:</p>
        <a class="btn blue" style="display:block;text-align:center;text-decoration:none" href="${waShare('Tu acceso al escáner de la caseta 🎪 ' + r.loginUrl, $('#t_phone').value)}" target="_blank">📲 Enviar por WhatsApp</a>
        <button class="btn ghost" onclick="navigator.clipboard.writeText(${JSON.stringify(r.loginUrl).replace(/"/g,'&quot;')});this.textContent='¡Copiado!'">Copiar link</button>`);
      render();
    } catch (e) { $('#t_err').textContent = e.message; }
  };
  const box = $('#t_list');
  for (const s of staff) {
    const row = document.createElement('div'); row.className = 'row';
    const suspended = s.status === 'suspendido';
    row.innerHTML = `<div class="who"><b>${esc(s.name ?? '')}</b><small>${s.role === 'puerta' ? '🚪 puerta' : '🍽 camarero'} · +${s.phone}</small></div>
      ${s.loginUrl ? '<button class="btn mini blue">Link</button>' : ''}
      <button class="btn mini ghost">${suspended ? 'Activar' : 'Baja'}</button>`;
    const btns = row.querySelectorAll('button');
    if (s.loginUrl) btns[0].onclick = () => dlg(`<h2>Acceso de ${esc(s.name ?? '')}</h2>
      <a class="btn blue" style="display:block;text-align:center;text-decoration:none" href="${waShare('Tu acceso al escáner de la caseta 🎪 ' + s.loginUrl, s.phone)}" target="_blank">📲 Enviar por WhatsApp</a>
      <button class="btn ghost" onclick="navigator.clipboard.writeText(${JSON.stringify(s.loginUrl).replace(/"/g,'&quot;')});this.textContent='¡Copiado!'">Copiar link</button>`);
    btns[btns.length-1].onclick = async () => { await post(`/papi/socios/${s.id}/suspender`); render(); };
    box.appendChild(row);
  }
}

// ---------- init ----------
(async () => {
  try { me = await api('/papi/me'); $('#casetaName').textContent = me.caseta; render(); }
  catch { /* redirigido a / */ }
})();
</script>
</body>
</html>
