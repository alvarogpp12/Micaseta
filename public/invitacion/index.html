<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitación — Micaseta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f6fa; --surface:#ffffff; --border:#e6e8f0; --text:#101828; --muted:#667085;
    --primary:#4353ff; --primary-dark:#3543d9; --primary-soft:#eef0ff;
    --danger:#f04438; --danger-soft:#feeceb;
    --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.06);
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:420px; margin:0 auto; padding:26px 18px 60px; }
  .wordmark { text-align:center; font-weight:800; font-size:15px; letter-spacing:-.03em; color:var(--muted); margin-bottom:18px; }
  .wordmark i { color:var(--primary); font-style:normal; }
  .ticket { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .ticket-head { background:linear-gradient(120deg, var(--primary), #6e3aff); color:#fff; padding:24px 22px; }
  .ticket-head .from { font:600 12.5px Inter,sans-serif; opacity:.85; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .ticket-head h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.2; }
  .ticket-body { padding:20px 22px; }
  .cond { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--border); font-size:14.5px; }
  .cond:last-child { border-bottom:0; }
  .cond svg { width:17px; height:17px; color:var(--primary); flex-shrink:0; margin-top:2px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; margin-top:16px; }
  .card h3 { font-size:16px; letter-spacing:-.01em; }
  .mut { color:var(--muted); font-size:13.5px; line-height:1.55; margin-top:5px; }
  label { display:block; font:600 12.5px Inter,sans-serif; color:#344054; margin:14px 0 5px; }
  input { width:100%; padding:11px 13px; border-radius:9px; border:1px solid #d0d5dd; background:#fff; color:var(--text); font:400 15px Inter,sans-serif; outline:none; transition:border .15s, box-shadow .15s; }
  input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(67,83,255,.12); }
  .btn { width:100%; border:0; border-radius:10px; padding:13px; font:700 15px Inter,sans-serif; cursor:pointer; margin-top:12px; transition:background .15s; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-dark); }
  .btn-sec { background:var(--surface); color:var(--text); border:1px solid var(--border); font-weight:600; }
  .selfie-zone { display:flex; align-items:center; gap:14px; margin-top:6px; }
  .selfie { width:84px; height:84px; border-radius:99px; object-fit:cover; background:var(--primary-soft); border:2px dashed #c7cdff; flex-shrink:0; }
  .err { color:var(--danger); font:600 13.5px Inter,sans-serif; margin-top:10px; min-height:18px; }
  .dead { background:var(--danger-soft); color:#b42318; border-radius:12px; padding:16px; text-align:center; font-weight:600; font-size:14.5px; }
  .hidden { display:none; }
  .qrwrap { text-align:center; }
  .qrwrap h3 { font-size:18px; }
  .qrframe { background:#fff; border:1px solid var(--border); border-radius:14px; padding:12px; margin-top:14px; }
  .qrframe img { width:100%; display:block; }
  .divider { border-top:2px dashed var(--border); margin:16px -22px 14px; position:relative; }
  .center { text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">micaseta<i>.</i></div>

  <div id="dead" class="dead hidden"></div>

  <div id="invite" class="hidden">
    <div class="ticket">
      <div class="ticket-head">
        <div class="from" id="from">Invitación</div>
        <h1 id="title"></h1>
      </div>
      <div class="ticket-body" id="conds"></div>
    </div>

    <div class="card">
      <h3>Confirma tu asistencia</h3>
      <p class="mut">Tu código QR es personal: en la puerta y al pedir comprobarán que la foto eres tú.</p>
      <label>Nombre y apellido</label>
      <input id="g_name" placeholder="Ana López" autocomplete="name">
      <div id="phoneWrap" class="hidden">
        <label>Tu móvil (WhatsApp)</label>
        <input id="g_phone" placeholder="612 345 678" inputmode="tel" autocomplete="tel">
      </div>
      <label>Foto de tu rostro</label>
      <input id="g_file" type="file" accept="image/*" capture="user" style="display:none">
      <div class="selfie-zone">
        <img id="g_prev" class="selfie" alt="">
        <button class="btn btn-sec" id="g_take" style="margin:0">Hacer o elegir selfie</button>
      </div>
      <button class="btn btn-primary" id="g_go" style="margin-top:18px">Aceptar invitación</button>
      <div class="err" id="g_err"></div>
    </div>
  </div>

  <div id="done" class="hidden">
    <div class="card qrwrap">
      <h3 id="doneName"></h3>
      <p class="mut">Este es tu acceso. Haz una captura de pantalla o vuelve a abrir este enlace cuando lo necesites.</p>
      <div class="divider"></div>
      <div class="qrframe"><img id="qrImg" alt="Tu código QR"></div>
      <p class="mut" id="compHint" style="margin-top:12px"></p>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const t = new URLSearchParams(location.search).get('t') ?? '';
let photoB64 = null;

const ICONS = {
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  glass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14l-1.5 9a5.5 5.5 0 0 1-11 0L5 3z" opacity=".9"/><path d="M12 17v4M8 21h8"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
};

async function load() {
  const r = await fetch('/gapi/invitacion?t=' + encodeURIComponent(t));
  if (!r.ok) { $('dead').textContent = 'Este enlace de invitación no es válido.'; $('dead').classList.remove('hidden'); return; }
  const inv = await r.json();
  if (inv.status === 'cancelada' || inv.status === 'rechazada') {
    $('dead').textContent = 'Esta invitación ya no está activa.';
    $('dead').classList.remove('hidden');
    return;
  }
  if (inv.registered && inv.qrToken) return showQr(inv.guestName, inv.qrToken, inv.maxCompanions);

  $('from').textContent = inv.socio + ' te invita a';
  $('title').textContent = inv.caseta;
  const icons = [ICONS.cal, ICONS.glass, ICONS.users];
  $('conds').innerHTML = inv.conditions.split('\n').map((line, idx) =>
    `<div class="cond">${icons[idx] ?? ICONS.cal}<span>${line.replace(/^[^A-Za-zÀ-ÿ0-9]+\s*/, '')}</span></div>`
  ).join('');
  if (inv.needsPhone) $('phoneWrap').classList.remove('hidden');
  if (inv.guestName) $('g_name').value = inv.guestName;
  $('invite').classList.remove('hidden');
}

function showQr(name, qrToken, maxComp) {
  $('invite').classList.add('hidden');
  $('done').classList.remove('hidden');
  $('doneName').textContent = `Listo, ${name}`;
  $('qrImg').src = '/qr.png?t=' + encodeURIComponent(qrToken);
  if (maxComp > 0) $('compHint').textContent = `Puedes traer hasta ${maxComp} acompañantes: pide al socio que cree sus invitaciones.`;
}

$('g_take').onclick = () => $('g_file').click();
$('g_file').addEventListener('change', () => {
  const f = $('g_file').files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 800, scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const dataUrl = cv.toDataURL('image/jpeg', 0.85);
      photoB64 = dataUrl.split(',')[1];
      $('g_prev').src = dataUrl;
      $('g_prev').style.borderStyle = 'solid';
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
});

$('g_go').onclick = async () => {
  $('g_err').textContent = '';
  if (!photoB64) { $('g_err').textContent = 'Falta tu selfie.'; return; }
  const body = { t, name: $('g_name').value, photoBase64: photoB64 };
  if (!$('phoneWrap').classList.contains('hidden')) body.phone = $('g_phone').value;
  const r = await fetch('/gapi/invitacion/registro', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { $('g_err').textContent = data.error || 'Error'; return; }
  showQr(data.name, data.qrToken, 0);
};

load();
</script>
</body>
</html>
